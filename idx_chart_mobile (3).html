  e.stopPropagation();
  const p=document.getElementById('watchlist-panel');
  const showing=p.style.display==='flex';
  p.style.display=showing?'none':'flex';
  document.getElementById('ind-panel').style.display='none';
  if(!showing)renderWatchlist();
});

// ── Close panels on outside click ──
document.addEventListener('click',e=>{
  const ip=document.getElementById('ind-panel');
  const wp=document.getElementById('watchlist-panel');
  if(ip&&ip.style.display==='flex'&&
     !ip.contains(e.target)&&
     !document.getElementById('ind-panel-btn')?.contains(e.target))
    ip.style.display='none';
  if(wp&&wp.style.display==='flex'&&
     !wp.contains(e.target)&&
     !document.getElementById('watchlist-btn')?.contains(e.target))
    wp.style.display='none';
});

// ── Watchlist star clicks in sidebar (delegated) ──
document.getElementById('stock-list').addEventListener('click',e=>{
  const star=e.target.closest('.wl-star');
  if(!star)return;
  e.stopPropagation();
  const t=star.dataset.star;
  if(watchlist.includes(t))removeFromWatchlist(t);
  else addToWatchlist(t);
  renderList(document.getElementById('search-inp').value,S.activeSector);
  renderWatchlist();
});

// ════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════
//  INDICATOR PANEL  (dropdown grid, each card = toggle + settings shortcut)
// ════════════════════════════════════════════════════════════
const IND_META = [
  {key:'candle',  label:'Candlestick',      group:'Chart'},
  {key:'ma',      label:'Moving Average',   group:'Trend'},
  {key:'ema',     label:'EMA',              group:'Trend'},
  {key:'bb',      label:'Bollinger Bands',  group:'Trend'},
  {key:'sr',      label:'Support & Resistance', group:'Trend'},
  {key:'supertrend', label:'Supertrend',    group:'Trend'},
  {key:'ichimoku',label:'Ichimoku Cloud',   group:'Trend'},
  {key:'swingHL', label:'Swing High/Low',   group:'Structure'},
  {key:'fvg',     label:'Fair Value Gap',   group:'Structure'},
  {key:'ob',      label:'Order Block',      group:'Structure'},
  {key:'sig',     label:'Buy/Sell Signals', group:'Signal'},
  {key:'macdPanel',label:'MACD',            group:'Momentum'},
  {key:'stochPanel',label:'Stochastic',     group:'Momentum'},
  {key:'vol',     label:'Volume Bars',      group:'Volume'},
  {key:'vp',      label:'Volume Profile',   group:'Volume'},
  {key:'hvn',     label:'High Volume Node', group:'Volume'},
  {key:'volDelta',label:'Volume Delta',     group:'Volume'},
  {key:'orderBubbles',label:'Order Bubbles',group:'Volume'},
  {key:'footprint',label:'Footprint Chart', group:'Volume'},
  {key:'pat',     label:'Candle Patterns',  group:'Patterns'},
  {key:'amfd',    label:'AMFD Cycle (SMC)',  group:'Smart Money'},
];

function buildIndPanel(){
  const grid = document.getElementById('ind-grid');
  if(!grid) return;
  // Group by category
  const groups = {};
  IND_META.forEach(m=>{ if(!groups[m.group])groups[m.group]=[]; groups[m.group].push(m); });

  grid.innerHTML = Object.entries(groups).map(([grp,items])=>`
    <div style="grid-column:1/-1;font-size:10px;font-weight:700;color:var(--text3);
      text-transform:uppercase;letter-spacing:1px;margin-top:6px;margin-bottom:2px">${grp}</div>
    ${items.map(m=>{
      const conf = IC[m.key];
      const on   = conf?.vis;
      return `<div class="ind-card-item ${on?'ind-on':''}" data-ind-key="${m.key}"
        style="display:flex;align-items:center;justify-content:space-between;
        padding:5px 8px;border:1px solid ${on?'var(--amber)':'var(--border2)'};
        border-radius:5px;cursor:pointer;background:${on?'rgba(245,158,11,.08)':'transparent'};
        transition:all .12s;gap:6px">
        <span style="font-size:11px;color:${on?'var(--amber)':'var(--text2)'}">${m.label}</span>
        <div style="display:flex;gap:4px;align-items:center">
          <span class="ind-vis-dot" style="width:8px;height:8px;border-radius:50%;
            background:${on?'var(--amber)':'var(--border2)'};flex-shrink:0"></span>
          <button class="ind-cfg-btn" data-cfg-key="${m.key}"
            style="background:none;border:none;color:var(--text3);cursor:pointer;
            font-size:10px;padding:0 2px" title="Configure">⚙</button>
        </div>
      </div>`;
    }).join('')}
  `).join('');

  // Toggle visibility on card click
  grid.querySelectorAll('.ind-card-item').forEach(card=>{
    card.addEventListener('click', e=>{
      if(e.target.classList.contains('ind-cfg-btn')) return; // handled separately
      const key = card.dataset.indKey;
      if(!IC[key]) return;
      IC[key].vis = !IC[key].vis;
      buildIndPanel();
      updateIndOverlay();
      buildLegend();
      draw();
    });
  });

  // Open settings panel on ⚙ click
  grid.querySelectorAll('.ind-cfg-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      document.getElementById('ind-panel').style.display='none';
      document.getElementById('settings-panel').classList.add('open');
      // Scroll to the right card in settings panel
      const key = btn.dataset.cfgKey;
      setTimeout(()=>{
        const el = document.querySelector(`#sp-body [data-key="${key}"]`);
        if(el) el.closest('.ind-card')?.scrollIntoView({behavior:'smooth',block:'nearest'});
      }, 80);
    });
  });
}

// ── Indicator Overlay (top-left of chart) ──
function updateIndOverlay(){
  const overlay = document.getElementById('ind-overlay');
  if(!overlay) return;
  overlay.innerHTML = IND_META
    .filter(m => IC[m.key]?.vis)
    .map(m => {
      const conf = IC[m.key];
      // Build a short param string
      let param = '';
      if(conf.p1)  param += conf.p1;
      if(conf.p2)  param += ','+conf.p2;
      if(conf.period) param = conf.period;
      if(conf.kPeriod)param = conf.kPeriod+','+conf.dPeriod;
      return `<div class="ind-chip" data-chip-key="${m.key}"
        style="display:flex;align-items:center;gap:4px;padding:2px 6px;
        background:rgba(13,13,15,0.75);border:1px solid rgba(255,255,255,0.1);
        border-radius:4px;font-size:10px;color:var(--text2);cursor:default;
        pointer-events:all;white-space:nowrap">
        <span style="color:var(--text)">${m.label}${param?'('+param+')':''}</span>
        <button class="chip-eye" data-eye="${m.key}" title="Hide"
          style="background:none;border:none;color:var(--text3);cursor:pointer;
          font-size:10px;line-height:1;padding:0">👁</button>
        <button class="chip-edit" data-edit="${m.key}" title="Edit"
          style="background:none;border:none;color:var(--text3);cursor:pointer;
          font-size:10px;line-height:1;padding:0">✎</button>
        <button class="chip-remove" data-remove="${m.key}" title="Remove"
          style="background:none;border:none;color:var(--text3);cursor:pointer;
          font-size:10px;line-height:1;padding:0">×</button>
      </div>`;
    }).join('');

  // Wire chip buttons
  overlay.querySelectorAll('.chip-eye').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const k = btn.dataset.eye;
      if(IC[k]) IC[k].vis = !IC[k].vis;
      updateIndOverlay(); buildIndPanel(); buildLegend(); draw();
    });
  });
  overlay.querySelectorAll('.chip-edit').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const k = btn.dataset.edit;
      document.getElementById('settings-panel').classList.add('open');
      setTimeout(()=>{
        const el = document.querySelector(`#sp-body [data-key="${k}"]`);
        if(el) el.closest('.ind-card')?.scrollIntoView({behavior:'smooth',block:'nearest'});
      }, 80);
    });
  });
  overlay.querySelectorAll('.chip-remove').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const k = btn.dataset.remove;
      if(IC[k]) IC[k].vis = false;
      updateIndOverlay(); buildIndPanel(); buildLegend(); draw();
    });
  });
}

// ════════════════════════════════════════════════════════════
//  WATCHLIST SYSTEM
// ════════════════════════════════════════════════════════════
const WL_KEY = 'idx_pro_watchlist';

function loadWatchlist(){
  try{ watchlist = JSON.parse(localStorage.getItem(WL_KEY)||'[]'); }
  catch(_){ watchlist = []; }
}
function saveWatchlist(){ try{localStorage.setItem(WL_KEY,JSON.stringify(watchlist))}catch(_){} }

function addToWatchlist(ticker){
  if(watchlist.includes(ticker)) return;
  watchlist.push(ticker);
  saveWatchlist();
  renderWatchlist();
}
function removeFromWatchlist(ticker){
  watchlist = watchlist.filter(t=>t!==ticker);
  saveWatchlist();
  renderWatchlist();
}

function renderWatchlist(){
  const list = document.getElementById('watchlist-list');
  if(!list) return;
  if(!watchlist.length){
    list.innerHTML = '<div style="padding:12px;font-size:11px;color:var(--text3);text-align:center">No stocks in watchlist.<br>Search and add with ★</div>';
    return;
  }
  list.innerHTML = watchlist.map(t=>{
    const p = S.priceCache[t];
    const info = STOCKS.find(s=>s.t===t);
    const pct = p?.pct??0;
    const cls = pct>0?'up':pct<0?'dn':'flat';
    const sg  = pct>0?'+':'';
    return `<div class="wl-item" data-t="${t}"
      style="display:flex;align-items:center;justify-content:space-between;
      padding:6px 12px;border-bottom:1px solid var(--border);cursor:pointer;
      transition:background .1s"
      onmouseover="this.style.background='var(--bg2)'"
      onmouseout="this.style.background=''">
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--text)">${t}</div>
        <div style="font-size:10px;color:var(--text2)">${info?.n||''}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:12px;font-weight:600;color:var(--text)">${p?fmt(p.price):'—'}</div>
        <div style="font-size:11px;font-weight:600" class="${cls}">${p?sg+pct.toFixed(2)+'%':'—'}</div>
      </div>
      <button onclick="event.stopPropagation();removeFromWatchlist('${t}')"
        style="background:none;border:none;color:var(--text3);cursor:pointer;
        font-size:14px;padding:0 0 0 8px" title="Remove">×</button>
    </div>`;
  }).join('');

  list.querySelectorAll('.wl-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      S.sym = el.dataset.t;
      const info = STOCKS.find(s=>s.t===S.sym);
      document.getElementById('sym-display').textContent = S.sym+(info?' · '+info.n:'');
      document.getElementById('watchlist-panel').style.display='none';
      renderList(document.getElementById('search-inp').value, S.activeSector);
      loadData();
    });
  });
}

// Wire watchlist search — suggest stocks as you type
function initWatchlistSearch(){
  const inp = document.getElementById('wl-search');
  if(!inp) return;
  inp.addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      const t = inp.value.trim().toUpperCase();
      if(t){ addToWatchlist(t); inp.value=''; }
    }
  });
  inp.addEventListener('input', e=>{
    const q = e.target.value.toUpperCase();
    if(q.length < 1){ renderWatchlist(); return; }
    // Show matching stocks as quick-add buttons
    const matches = STOCKS.filter(s=>s.t.startsWith(q)||s.n.toUpperCase().includes(q)).slice(0,6);
    const list = document.getElementById('watchlist-list');
    const exists = watchlist;
    list.innerHTML = matches.map(s=>`
      <div style="display:flex;align-items:center;justify-content:space-between;
        padding:5px 12px;border-bottom:1px solid var(--border)">
        <span style="font-size:11px;color:var(--text)">${s.t} <span style="color:var(--text2)">${s.n}</span></span>
        <button onclick="addToWatchlist('${s.t}');document.getElementById('wl-search').value='';renderWatchlist()"
          style="padding:2px 8px;background:var(--blue);border:none;border-radius:4px;
          color:#fff;font-size:10px;cursor:pointer">
          ${exists.includes(s.t)?'✓ Added':'+ Add'}</button>
      </div>`).join('');
  });
}

// ── Add ⭐ button to sidebar stock items ──
function stockItem(s){
  const p = S.priceCache[s.t];
  const pct = (p?.pct!=null&&!isNaN(p.pct))?p.pct:null;
  const cls = pct!==null?(pct>0?'up':pct<0?'dn':'flat'):'flat';
  const sg  = pct!==null&&pct>0?'+':'';
  const inWL = watchlist.includes(s.t);
  const prHtml = p
    ? `<div class="px ${cls}">${fmt(p.price)}</div>
       <div class="ch ${cls}">${pct!==null?sg+pct.toFixed(2)+'%':'—'}</div>`
    : `<div class="ch flat">—</div>`;
  return `<div class="si${s.t===S.sym?' active':''}" data-t="${s.t}"
    style="position:relative">
    <div class="si-l">
      <div class="tick">${s.t}</div>
      <div class="nm">${s.n}</div>
    </div>
    <div class="si-r">${prHtml}</div>
    <button class="wl-star" data-star="${s.t}"
      style="position:absolute;top:4px;right:2px;background:none;border:none;
      cursor:pointer;font-size:9px;color:${inWL?'#f59e0b':'var(--border2)'};
      padding:1px;line-height:1" title="${inWL?'Remove from watchlist':'Add to watchlist'}">★</button>
  </div>`;
}

// ════════════════════════════════════════════════════════════
//  MOBILE SIDEBAR TOGGLE
// ════════════════════════════════════════════════════════════
function openMobileSidebar(){
  document.getElementById('sidebar').classList.add('mob-open');
  document.getElementById('sidebar-overlay').classList.add('visible');
}
function closeMobileSidebar(){
  document.getElementById('sidebar').classList.remove('mob-open');
  document.getElementById('sidebar-overlay').classList.remove('visible');
}
document.getElementById('mob-menu-btn')?.addEventListener('click', openMobileSidebar);

// Auto-close sidebar when a stock is selected on mobile
document.getElementById('stock-list').addEventListener('click', ()=>{
  if(window.innerWidth<=768) closeMobileSidebar();
}, true);

(async()=>{
  resize();
  const info=STOCKS.find(s=>s.t==='BBCA');
  document.getElementById('sym-display').textContent='BBCA · '+info?.n;
  // Set default interval selector to 5m
  const intSel=document.getElementById('tf-interval-sel');
  if(intSel)intSel.value='5m';
  renderList('','all');
  buildSettingsPanel();
  buildIndPanel();
  updateIndOverlay();
  loadWatchlist();
  renderWatchlist();
  initWatchlistSearch();
  await loadData();

  // Background price fetch for sidebar — parallel batches of 5
  (async()=>{
    const list=[...STOCKS];
    const BATCH=5;
    for(let i=0;i<list.length;i+=BATCH){
      const batch=list.slice(i,i+BATCH);
      await Promise.allSettled(batch.map(async s=>{
        if(S.priceCache[s.t])return;
        // Use 1mo/1d for reliability; only need last close
        try{
          // Fetch 2 days so we can compute today-vs-yesterday %
          const d=await fetchYahoo(s.t,'1d',2,null,null);
          if(d?.length>=1){
            const l=d[d.length-1];
            // Daily % = today close vs previous close (or open if only 1 bar)
            const prevClose=d.length>=2?d[d.length-2].c:l.o;
            const chg=l.c-prevClose, pct=prevClose?chg/prevClose*100:0;
            S.priceCache[s.t]={price:l.c,chg,pct,date:l.t};
          }
        }catch(_){
          try{
            const d=await fetchYahoo(s.t,'1wk',14,null,null);
            if(d?.length>=1){
              const l=d[d.length-1],prev=d.length>=2?d[d.length-2].c:l.o;
              S.priceCache[s.t]={price:l.c,chg:l.c-prev,pct:prev?(l.c-prev)/prev*100:0,date:l.t};
            }
          }catch(_){}
        }
      }));
      renderList(document.getElementById('search-inp').value,S.activeSector);
      await new Promise(r=>setTimeout(r,150));
    }
  })();
})();
</script>
