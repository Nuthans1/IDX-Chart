<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>IDX Pro Chart</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#0d0d0f;--bg1:#13131a;--bg2:#1a1a24;--bg3:#22222e;--bg4:#2a2a3a;
  --border:#2a2a3a;--border2:#3a3a50;--border3:#4a4a60;
  --text:#e0e0f0;--text2:#8888aa;--text3:#555570;
  --up:#26a69a;--dn:#ef5350;
  --blue:#4f8ef7;--amber:#f59e0b;--purple:#a78bfa;--teal:#2dd4bf;--pink:#f472b6;
  --r:6px;
  --topbar-h:48px;
  --bottomnav-h:52px;
}
html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--text);
  font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;
  -webkit-text-size-adjust:100%;touch-action:manipulation}

/* ═══════════════════ TOPBAR ═══════════════════ */
#topbar{height:var(--topbar-h);background:var(--bg1);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0;z-index:50}
#topbar h1{font-size:13px;font-weight:700;letter-spacing:2px;color:var(--blue);flex-shrink:0}
.t-sep{width:1px;height:20px;background:var(--border);margin:0 2px;flex-shrink:0}
#sym-display{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
#price-display{font-size:15px;font-weight:700;flex-shrink:0}
#chg-display{font-size:11px;font-weight:600;flex-shrink:0}
.up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--text2)}
#live-dot{width:7px;height:7px;border-radius:50%;background:var(--up);
  animation:blink 2s infinite;margin-left:auto;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#update-lbl{font-size:10px;color:var(--text2);flex-shrink:0}

/* Mobile menu button in topbar */
#mob-menu-btn{display:none;background:none;border:1px solid var(--border2);
  border-radius:var(--r);color:var(--text2);cursor:pointer;font-size:16px;
  padding:4px 8px;flex-shrink:0;line-height:1;-webkit-tap-highlight-color:transparent}

/* ═══════════════════ LAYOUT ═══════════════════ */
#layout{display:flex;height:calc(100vh - var(--topbar-h));position:relative}

/* ═══════════════════ SIDEBAR ═══════════════════ */
#sidebar{width:196px;min-width:196px;background:var(--bg1);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;transition:transform .25s cubic-bezier(.4,0,.2,1)}
#sb-search{padding:8px;border-bottom:1px solid var(--border)}
#sb-search input{width:100%;background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--r);padding:6px 10px;color:var(--text);font-size:13px;outline:none}
#sb-search input:focus{border-color:var(--blue)}
#stock-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#stock-list::-webkit-scrollbar{width:3px}
#stock-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.sec-hdr{padding:6px 10px;font-size:10px;font-weight:600;color:var(--text3);
  background:var(--bg2);border-bottom:1px solid var(--border);cursor:pointer;
  text-transform:uppercase;letter-spacing:.5px;user-select:none}
.sec-hdr:hover{color:var(--text2);background:var(--bg3)}
.sec-hdr.collapsed::after{content:' ▶'}
.sec-hdr:not(.collapsed)::after{content:' ▼'}
.si{padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;transition:background .1s;
  -webkit-tap-highlight-color:transparent}
.si:hover{background:var(--bg2)}
.si.active{background:var(--bg3);border-left:2px solid var(--blue)}
.si-l .tick{font-size:12px;font-weight:700}
.si-l .nm{font-size:10px;color:var(--text2);max-width:100px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-r{text-align:right}
.si-r .px{font-size:11px}
.si-r .ch{font-size:10px;font-weight:600}

/* Overlay backdrop for sidebar on mobile */
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:89}

/* ═══════════════════ MAIN ═══════════════════ */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ═══════════════════ TOOLBAR ═══════════════════ */
#toolbar{padding:4px 8px;border-bottom:1px solid var(--border);background:var(--bg1);
  display:flex;align-items:center;gap:4px;flex-shrink:0;
  overflow-x:auto;flex-wrap:nowrap}
#toolbar::-webkit-scrollbar{height:3px}
#toolbar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.tf-sel{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);
  color:var(--text);font-size:12px;padding:5px 6px;cursor:pointer;outline:none;
  -webkit-appearance:none;min-height:30px}
.tf-sel:focus{border-color:var(--blue)}
.tf-btn,.ind-btn,.tool-btn,.act-btn{
  padding:5px 9px;font-size:11px;font-weight:500;
  border:1px solid var(--border2);border-radius:var(--r);
  background:transparent;color:var(--text2);cursor:pointer;
  transition:all .12s;white-space:nowrap;line-height:1.4;min-height:30px;
  -webkit-tap-highlight-color:transparent}
.tf-btn:active,.ind-btn:active,.tool-btn:active,.act-btn:active{
  background:var(--bg2);color:var(--text)}
.tf-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.ind-btn.on{border-color:var(--amber);color:var(--amber);background:rgba(245,158,11,.1)}
.tool-btn.on{border-color:var(--purple);color:var(--purple);background:rgba(167,139,250,.1)}
.act-btn{border-color:var(--border3);color:var(--text2)}
.hdr-sep{width:1px;height:16px;background:var(--border2);margin:0 2px;flex-shrink:0}
.grp-lbl{font-size:10px;color:var(--text3);margin:0 2px;flex-shrink:0}

/* ═══════════════════ CANVAS AREA ═══════════════════ */
#canvas-outer{flex:1;position:relative;overflow:hidden}
#chart-canvas{display:block;width:100%;height:100%}
#chart-canvas.cur-cross{cursor:crosshair}
#chart-canvas.cur-grab{cursor:grab}
#chart-canvas.cur-grabbing{cursor:grabbing}
#chart-canvas.cur-ns{cursor:ns-resize}

/* OHLCV bar */
#ohlcv-bar{position:absolute;top:6px;left:6px;font-size:10px;color:var(--text2);
  pointer-events:none;display:flex;gap:6px;flex-wrap:wrap;max-width:65%}
.ov{display:flex;gap:2px}.ov-v{color:var(--text);font-weight:600}

/* Legend */
#legend{padding:4px 8px;background:var(--bg1);border-top:1px solid var(--border);
  display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;min-height:22px;overflow:hidden}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2)}
.leg-line{width:14px;height:2px;border-radius:1px}

/* Price Panel */
#price-panel{
  position:absolute;right:0;top:0;width:76px;
  background:rgba(13,13,15,0.88);border-left:1px solid var(--border);
  padding:5px 0;font-size:10px;z-index:5;
  display:flex;flex-direction:column;
  pointer-events:none;
  border-bottom-left-radius:6px;
}
.pp-row{display:flex;justify-content:space-between;padding:2px 5px;gap:3px}
.pp-lbl{color:var(--text3);white-space:nowrap}
.pp-val{color:var(--text);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.pp-high{color:var(--up)}
.pp-low{color:var(--dn)}
.pp-sep{height:1px;background:var(--border);margin:2px 0}

/* Ind panel & watchlist */
#ind-panel{flex-direction:column;overflow-y:auto}
#watchlist-panel{flex-direction:column;overflow-y:auto}
.ind-card-item:hover{background:rgba(245,158,11,0.05)!important;border-color:var(--amber)!important}
.ind-on{background:rgba(245,158,11,0.08)!important}
#ind-overlay{user-select:none}
.ind-chip:hover{border-color:rgba(255,255,255,0.2)!important;background:rgba(13,13,15,0.9)!important}
.wl-item:hover{background:var(--bg2)!important}

/* Watchlist panel */
#watchlist-panel{position:absolute;top:86px;right:0;width:260px;
  background:var(--bg1);border:1px solid var(--border);
  border-radius:0 0 0 8px;z-index:150;max-height:65vh;overflow-y:auto;flex-direction:column}

/* Loading */
#loading{position:absolute;inset:0;background:rgba(13,13,15,.95);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;z-index:40;font-size:12px;color:var(--text2)}
.spinner{width:24px;height:24px;border:2px solid var(--border2);
  border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#err-msg{color:var(--dn);max-width:300px;text-align:center}
#retry-btn{padding:6px 16px;border:1px solid var(--border2);border-radius:var(--r);
  background:var(--bg2);color:var(--text);cursor:pointer;display:none;font-size:13px}

/* ═══════════════════ SETTINGS PANEL ═══════════════════ */
#settings-panel{
  position:absolute;right:0;top:0;bottom:0;width:300px;
  background:var(--bg1);border-left:1px solid var(--border);
  display:flex;flex-direction:column;z-index:60;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1)}
#settings-panel.open{transform:translateX(0)}
#sp-header{
  padding:10px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#sp-header h2{font-size:13px;font-weight:600;color:var(--text)}
#sp-close{background:none;border:none;color:var(--text2);cursor:pointer;
  font-size:18px;line-height:1;padding:0 2px}
#sp-close:hover{color:var(--text)}
#sp-body{flex:1;overflow-y:auto;padding:8px 0}
#sp-body::-webkit-scrollbar{width:4px}
#sp-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* Indicator card in settings */
.ind-card{border-bottom:1px solid var(--border);padding:8px 14px}
.ind-card-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ind-card-hdr span{font-size:12px;font-weight:600;flex:1}
/* Toggle switch */
.tog{position:relative;width:32px;height:18px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog-sl{position:absolute;inset:0;background:var(--border2);border-radius:9px;
  cursor:pointer;transition:background .2s}
.tog-sl:before{content:'';position:absolute;width:12px;height:12px;
  left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s}
.tog input:checked+.tog-sl{background:var(--blue)}
.tog input:checked+.tog-sl:before{transform:translateX(14px)}
/* Settings rows */
.sp-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.sp-row label{font-size:11px;color:var(--text2);min-width:80px}
.sp-inp{background:var(--bg2);border:1px solid var(--border2);
  border-radius:4px;color:var(--text);font-size:11px;padding:3px 6px;width:70px;outline:none}
.sp-inp:focus{border-color:var(--blue)}
.sp-color{width:32px;height:22px;padding:1px;border:1px solid var(--border2);
  border-radius:4px;background:var(--bg2);cursor:pointer}
.sp-sect{font-size:10px;color:var(--text3);text-transform:uppercase;
  letter-spacing:1px;padding:4px 14px 2px;margin-top:4px}
.sp-apply{
  margin:4px 14px 0;padding:4px 10px;font-size:11px;
  background:var(--blue);border:none;border-radius:var(--r);
  color:#fff;cursor:pointer;width:calc(100% - 28px)}
.sp-apply:hover{background:#3a7de8}

/* Tooltip for drawings */
#draw-hint{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);
  background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);
  padding:5px 12px;font-size:11px;color:var(--amber);pointer-events:none;
  display:none;white-space:nowrap;z-index:20}
/* Drawing selection handles */
.draw-handle{position:absolute;width:10px;height:10px;border-radius:50%;
  background:var(--blue);border:2px solid #fff;cursor:grab;z-index:30;
  transform:translate(-50%,-50%)}
/* Edit drawing popup */
#draw-edit-popup{
  position:absolute;background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--r);padding:8px 10px;font-size:11px;z-index:50;display:none;
  min-width:180px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
#draw-edit-popup .dep-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
#draw-edit-popup label{font-size:10px;color:var(--text2);min-width:52px}
#draw-edit-popup input[type=color]{width:28px;height:20px;padding:1px;border:1px solid var(--border2);border-radius:3px;background:var(--bg3);cursor:pointer}
#draw-edit-popup input[type=number]{background:var(--bg3);border:1px solid var(--border2);border-radius:3px;color:var(--text);font-size:11px;padding:2px 5px;width:60px;outline:none}
#draw-edit-popup .dep-btns{display:flex;gap:5px;margin-top:4px}
#draw-edit-popup button{flex:1;padding:3px 6px;font-size:10px;border-radius:3px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer}
#draw-edit-popup .dep-del{border-color:var(--dn);color:var(--dn)}
#draw-edit-popup .dep-del:hover{background:var(--dn);color:#fff}

/* ═══════════════════════════════════════════
   MOBILE — max-width: 768px
═══════════════════════════════════════════ */
@media (max-width:768px){

  /* ── 1. SHOW HAMBURGER ── */
  #mob-menu-btn{display:flex!important;align-items:center;justify-content:center}

  /* ── 2. SIDEBAR: remove from flow, become a fixed overlay drawer ── */
  #sidebar{
    position:fixed!important;
    top:0!important;left:0!important;bottom:0!important;
    width:80vw!important;max-width:280px!important;
    min-width:0!important;
    transform:translateX(-100%)!important;
    z-index:900!important;
    transition:transform .25s ease!important;
    box-shadow:6px 0 24px rgba(0,0,0,.7)!important;
  }
  #sidebar.mob-open{transform:translateX(0)!important}

  /* ── 3. OVERLAY behind sidebar ── */
  #sidebar-overlay{
    position:fixed!important;inset:0!important;
    background:rgba(0,0,0,.6)!important;
    z-index:899!important;
    opacity:0!important;pointer-events:none!important;
    transition:opacity .25s ease!important;
  }
  #sidebar-overlay.visible{opacity:1!important;pointer-events:all!important}

  /* ── 4. MAIN: take full width since sidebar is out of flow ── */
  #layout{display:block!important}
  #main{
    width:100vw!important;
    height:calc(100vh - 48px)!important;
    display:flex!important;
    flex-direction:column!important;
    overflow:hidden!important;
  }

  /* ── 5. TOOLBAR: strict single horizontal scroll row ── */
  #toolbar{
    display:flex!important;
    flex-direction:row!important;
    flex-wrap:nowrap!important;
    overflow-x:scroll!important;
    overflow-y:hidden!important;
    -webkit-overflow-scrolling:touch!important;
    height:44px!important;
    min-height:44px!important;
    max-height:44px!important;
    align-items:center!important;
    gap:5px!important;
    padding:0 8px!important;
    scrollbar-width:none!important;
  }
  #toolbar::-webkit-scrollbar{display:none!important}
  #tf-grp{
    display:inline-flex!important;
    flex-wrap:nowrap!important;
    gap:4px!important;
    flex-shrink:0!important;
  }
  .tf-btn,.ind-btn,.tool-btn,.act-btn,.tf-sel,.grp-lbl,.hdr-sep{
    flex-shrink:0!important;
  }
  .tf-btn,.ind-btn,.tool-btn,.act-btn{
    padding:5px 10px!important;font-size:12px!important;
    min-height:32px!important;white-space:nowrap!important;
  }
  .tf-sel{padding:5px 6px!important;font-size:12px!important;min-height:32px!important}

  /* ── 6. CANVAS AREA fills remaining space ── */
  #canvas-outer{flex:1!important;min-height:0!important}

  /* ── 7. PANELS: fixed full-width sheets sliding from top ── */
  #ind-panel{
    position:fixed!important;
    top:48px!important;left:0!important;right:0!important;
    width:100vw!important;max-height:75vh!important;
    overflow-y:auto!important;z-index:800!important;
    border-radius:0 0 14px 14px!important;
    box-shadow:0 8px 32px rgba(0,0,0,.7)!important;
  }
  #ind-grid{grid-template-columns:1fr 1fr!important}
  #watchlist-panel{
    position:fixed!important;
    top:48px!important;left:0!important;right:0!important;
    width:100vw!important;max-width:100vw!important;
    max-height:75vh!important;
    border-radius:0 0 14px 14px!important;
    box-shadow:0 8px 32px rgba(0,0,0,.7)!important;
  }
  #settings-panel{width:100%!important;max-width:100%!important}

  /* ── 8. PRICE PANEL: shrink ── */
  #price-panel{width:70px!important;font-size:9px!important}
  .pp-row{padding:2px 4px!important}

  /* ── 9. MISC ── */
  #ohlcv-bar{font-size:9px!important;gap:4px!important;top:4px!important;left:4px!important;max-width:55%!important}
  #ind-overlay{max-width:50%!important}
  #legend{padding:3px 6px!important;min-height:18px!important}
  .leg{font-size:9px!important}
  .si{padding:10px 12px!important}
  .si-l .tick{font-size:13px!important}
  .si-l .nm{max-width:140px!important;font-size:11px!important}
  #sb-sector-tabs{flex-wrap:nowrap!important;overflow-x:auto!important}
  #sb-sector-tabs::-webkit-scrollbar{display:none!important}
  .sp-apply{padding:8px!important;font-size:13px!important}
}

/* Very small phones */
@media (max-width:390px){
  #sym-display{max-width:75px!important;font-size:11px!important}
  #price-display{font-size:13px!important}
  #chg-display{font-size:10px!important}
  #update-lbl{display:none}
  #topbar h1{letter-spacing:1px!important}
  #price-panel{display:none!important}
  #ind-grid{grid-template-columns:1fr!important}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <button id="mob-menu-btn" title="Stock list">☰</button>
  <h1>IDX PRO</h1>
  <div class="t-sep"></div>
  <span id="sym-display">—</span>
  <span id="price-display" class="flat">—</span>
  <span id="chg-display" class="flat">—</span>
  <div id="live-dot" style="margin-left:auto"></div>
  <span id="update-lbl">—</span>
  <button id="reload-btn" onclick="Object.keys(CACHE).filter(k=>k.startsWith(S.sym)).forEach(k=>delete CACHE[k]);loadData()" title="Manual Reload"
    style="padding:3px 9px;font-size:11px;border:1px solid var(--border2);border-radius:4px;
    background:transparent;color:var(--text2);cursor:pointer;margin-left:6px">↺</button>
</div>
<!-- Sidebar overlay (mobile) -->
<div id="sidebar-overlay" onclick="closeMobileSidebar()"></div>

<div id="layout">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sb-search">
      <input id="search-inp" placeholder="🔍 Cari saham..."/>
    </div>
    <div id="sb-sector-tabs" style="display:flex;flex-wrap:wrap;gap:2px;padding:4px 6px;border-bottom:1px solid var(--border);flex-shrink:0">
      <button class="sec-btn on" data-sec="all" style="padding:2px 6px;font-size:10px;border:1px solid var(--border2);border-radius:4px;background:var(--blue);color:#fff;cursor:pointer;border-color:var(--blue)">All</button>
      <button class="sec-btn" data-sec="index" style="padding:2px 6px;font-size:10px;border:1px solid var(--border2);border-radius:4px;background:transparent;color:var(--text2);cursor:pointer">📈</button>
      <button class="sec-btn" data-sec="bank" style="padding:2px 6px;font-size:10px;border:1px solid var(--border2);border-radius:4px;background:transparent;color:var(--text2);cursor:pointer">🏦</button>
      <button class="sec-btn" data-sec="tech" style="padding:2px 6px;font-size:10px;border:1px solid var(--border2);border-radius:4px;background:transparent;color:var(--text2);cursor:pointer">💻</button>
      <button class="sec-btn" data-sec="mining" style="padding:2px 6px;font-size:10px;border:1px solid var(--border2);border-radius:4px;background:transparent;color:var(--text2);cursor:pointer">⛏</button>
      <button class="sec-btn" data-sec="industry" style="padding:2px 6px;font-size:10px;border:1px solid var(--border2);border-radius:4px;background:transparent;color:var(--text2);cursor:pointer">🏭</button>
      <button class="sec-btn" data-sec="consumer" style="padding:2px 6px;font-size:10px;border:1px solid var(--border2);border-radius:4px;background:transparent;color:var(--text2);cursor:pointer">🛒</button>
      <button class="sec-btn" data-sec="property" style="padding:2px 6px;font-size:10px;border:1px solid var(--border2);border-radius:4px;background:transparent;color:var(--text2);cursor:pointer">🏗</button>

const PROXIES=[

// TF key → {range, interval} combos (tries in order until one works)
// Yahoo Finance valid combos: https://finance.yahoo.com/quote/BBCA.JK/history
// ══ NEW TF SYSTEM: interval (candle size) + range (days back) ══
// Maps interval → Yahoo interval string
const INTERVAL_MAP={
  '1m':'1m','2m':'2m','5m':'5m','15m':'15m','30m':'30m','45m':'60m',
  '60m':'60m','90m':'90m','2h_agg':'60m','4h_agg':'60m',
  '1d':'1d','1wk':'1wk','1mo':'1mo'
};
// Maps days → Yahoo range param
function daysToYahooRange(days){
  if(days<=1)return'1d';
  if(days<=5)return'5d';
  if(days<=30)return'1mo';
  if(days<=90)return'3mo';
  if(days<=180)return'6mo';
  if(days<=365)return'1y';
  return'2y';
}
// Aggregation factor for 2h/4h
function getAggFactor(interval){
  if(interval==='2h_agg')return 2;
  if(interval==='4h_agg')return 4;
  return 1;
}
// Build multiple Yahoo URLs to try
function buildYahooURLs(ticker,intervalKey,days){
  const yi=INTERVAL_MAP[intervalKey]||'1d';
  const yr=daysToYahooRange(days);
  // Tickers starting with ^ or already having . are used as-is
  const rawSym=ticker.startsWith('^')||ticker.includes('.')?ticker:ticker+'.JK';
  const sym=encodeURIComponent(rawSym);
  return[
    `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=${yi}&range=${yr}&includePrePost=false`,
    `https://query2.finance.yahoo.com/v8/finance/chart/${sym}?interval=${yi}&range=${yr}&includePrePost=false`,
    `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=${yi}&range=${yr}`,
  ];
}

// Client-side bar aggregation
function aggregateBars(bars,factor){
  if(factor<=1)return bars;
  const out=[];
  for(let i=0;i<bars.length;i+=factor){
    const sl=bars.slice(i,i+factor);
    if(!sl.length)continue;
    out.push({t:sl[0].t,o:sl[0].o,
      h:Math.max(...sl.map(b=>b.h||0)),
      l:Math.min(...sl.map(b=>b.l||Infinity)),
      c:sl[sl.length-1].c,v:sl.reduce((a,b)=>a+(b.v||0),0)});
  }
  return out;
}

// Filter bars to only include data from the last N calendar days
function filterByDays(bars,days){
  if(!bars.length)return bars;
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-days);
  cutoff.setHours(0,0,0,0);
  return bars.filter(b=>b.t>=cutoff);
}
// Filter bars between two Date objects
function filterByDateRange(bars,from,to){
  return bars.filter(b=>b.t>=from&&b.t<=to);
}
const CACHE={};
let proxyOrder=[0,1,2,3,4,5];

function wt(p,ms){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('to')),ms))])}
async function rawFetch(url,ms=8000){
  const r=await wt(fetch(url,{cache:'no-store'}),ms);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const txt=await r.text();
  if(!txt||!txt.trim())throw new Error('empty');
  return JSON.parse(txt);
}
async function fetchProxy(raw){
  try{return await rawFetch(PROXIES[proxyOrder[0]](raw),7000)}catch(_){}
  const rest=proxyOrder.slice(1);
  const {d,pi}=await Promise.any(rest.map((pi)=>
    rawFetch(PROXIES[pi](raw),9000).then(d=>({d,pi}))));
  proxyOrder=[pi,...proxyOrder.filter(x=>x!==pi)];
  return d;
}
function parseChart(json){
  const res=json?.chart?.result?.[0];
  if(!res?.timestamp)return null;
  const ts=res.timestamp,q=res.indicators?.quote?.[0];
  if(!q)return null;
  const bars=ts.map((t,i)=>({
    t:new Date(t*1000),o:q.open?.[i],h:q.high?.[i],
    l:q.low?.[i],c:q.close?.[i],v:q.volume?.[i]
  })).filter(b=>b.c!=null&&b.h!=null&&b.l!=null&&b.o!=null);
  return bars.length?bars:null;
}
function yahooURLs(sym,interval,range){
  const s=encodeURIComponent(sym+'.JK');
  return[
    `https://query1.finance.yahoo.com/v8/finance/chart/${s}?interval=${interval}&range=${range}&includePrePost=false`,
    `https://query2.finance.yahoo.com/v8/finance/chart/${s}?interval=${interval}&range=${range}&includePrePost=false`,
  ];
}
async function fetchYahoo(ticker,intervalKey,days,fromDate,toDate){
  // Build cache key
  const cacheKey=`${ticker}|${intervalKey}|${days}|${fromDate||''}|${toDate||''}`;
  if(CACHE[cacheKey])return CACHE[cacheKey];

  const aggFactor=getAggFactor(intervalKey);
  const urls=buildYahooURLs(ticker,intervalKey,days+5); // fetch extra days as buffer

  let lastErr='';
  for(const url of urls){
    try{
      const json=await fetchProxy(url);
      let bars=parseChart(json);
      if(!bars||bars.length<2){lastErr='empty';continue}
      // Client-side aggregation (2h=2×1h, 4h=4×1h)
      if(aggFactor>1)bars=aggregateBars(bars,aggFactor);
      // Filter to requested window
      if(fromDate&&toDate){
        bars=filterByDateRange(bars,fromDate,toDate);
      } else if(days>0){
        bars=filterByDays(bars,days);
      }
      if(!bars.length){lastErr='no bars in range';continue}
      CACHE[cacheKey]=bars;return bars;
    }catch(e){lastErr=e.message}
  }

  // Fallback: try wider range then re-filter
  const widerRanges=['1mo','3mo','6mo','1y','2y'];
  const yi=INTERVAL_MAP[intervalKey]||'1d';
  const sym=encodeURIComponent(ticker+'.JK');
  for(const wr of widerRanges){
    try{
      const url=`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=${yi}&range=${wr}`;
      const json=await fetchProxy(url);
      let bars=parseChart(json);
      if(!bars?.length)continue;
      if(aggFactor>1)bars=aggregateBars(bars,aggFactor);
      if(fromDate&&toDate)bars=filterByDateRange(bars,fromDate,toDate);
      else if(days>0)bars=filterByDays(bars,days);
      if(bars.length>=1){CACHE[cacheKey]=bars;return bars}
    }catch(_){}
  }
  throw new Error('Gagal memuat '+ticker+': '+lastErr);
}

function calcMA(d,p){
  return d.map((_,i)=>{
    if(i<p-1)return null;
    return d.slice(i-p+1,i+1).reduce((a,b)=>a+b.c,0)/p;
  });
}
function calcEMA(d,p){
  const k=2/(p+1);let e=null;
  return d.map((bar,i)=>{
    if(i<p-1)return null;
    if(i===p-1)e=d.slice(0,p).reduce((a,b)=>a+b.c,0)/p;
    else e=bar.c*k+e*(1-k);
    return e;
  });
}
function calcBB(d,p,m){
  const ma=calcMA(d,p);
  return d.map((_,i)=>{
    if(ma[i]==null)return{u:null,mid:null,l:null};
    const sl=d.slice(Math.max(0,i-p+1),i+1);
    const std=Math.sqrt(sl.reduce((s,x)=>s+(x.c-ma[i])**2,0)/sl.length);
    return{u:ma[i]+m*std,mid:ma[i],l:ma[i]-m*std};
  });
}
// Ichimoku
function calcIchimoku(d,t=9,k=26,sb=52){
  function hl(sl){return{h:Math.max(...sl.map(b=>b.h)),l:Math.min(...sl.map(b=>b.l))}}
  const ten=d.map((_,i)=>{if(i<t-1)return null;const{h,l}=hl(d.slice(i-t+1,i+1));return(h+l)/2});
  const kij=d.map((_,i)=>{if(i<k-1)return null;const{h,l}=hl(d.slice(i-k+1,i+1));return(h+l)/2});
  const sA=d.map((_,i)=>{if(!ten[i]||!kij[i])return null;return(ten[i]+kij[i])/2});
  const sB=d.map((_,i)=>{if(i<sb-1)return null;const{h,l}=hl(d.slice(i-sb+1,i+1));return(h+l)/2});
  return{tenkan:ten,kijun:kij,senkouA:sA,senkouB:sB};
}

function calcSR(d){
  const {window:win,maxLevels,tol}=IC.sr;
  const raw=[];
  for(let i=win;i<d.length-win;i++){
    const sl=d.slice(i-win,i+win+1);
    if(d[i].h===Math.max(...sl.map(x=>x.h)))raw.push({price:d[i].h,type:'R'});
    if(d[i].l===Math.min(...sl.map(x=>x.l)))raw.push({price:d[i].l,type:'S'});
  }
  const out=[];
  raw.forEach(p=>{
    const ex=out.find(o=>Math.abs(o.price-p.price)/p.price<tol/100);
    if(ex){ex.strength++;ex.price=(ex.price*(ex.strength-1)+p.price)/ex.strength}
    else out.push({price:p.price,type:p.type,strength:1});
  });
  return out.sort((a,b)=>b.strength-a.strength).slice(0,maxLevels);
}
function calcVP(d,bins){
  const hs=d.map(x=>x.h).filter(Boolean),ls=d.map(x=>x.l).filter(Boolean);
  if(!hs.length)return[];
  const maxP=Math.max(...hs),minP=Math.min(...ls),step=(maxP-minP)/bins||1;
  const prof=Array.from({length:bins},(_,i)=>({
    pL:minP+i*step,pH:minP+(i+1)*step,vol:0,upVol:0,dnVol:0
  }));
  d.forEach(bar=>{
    if(!bar.v||!bar.h||!bar.l)return;
    const rng=bar.h-bar.l||1;
    prof.forEach(b=>{
      const ov=Math.min(bar.h,b.pH)-Math.max(bar.l,b.pL);
      if(ov>0){
        const frac=ov/rng,v=bar.v*frac;
        b.vol+=v;
        if(bar.c>=bar.o)b.upVol+=v;else b.dnVol+=v;
      }
    });
  });
  return prof;
}
// Fair Value Gap
function calcFVG(d){
  const gaps=[];
  for(let i=2;i<d.length;i++){
    const a=d[i-2],c=d[i];
    if(c.l>a.h)  gaps.push({type:'bull',i0:i-2,i2:i,top:c.l,bottom:a.h,midIdx:i-1});
    if(c.h<a.l)  gaps.push({type:'bear',i0:i-2,i2:i,top:a.l,bottom:c.h,midIdx:i-1});
  }
  return gaps;
}
// Order Block
// ─── ORDER BLOCK (SMC) ─────────────────────────────────────────
// Algorithm: Proper Smart Money Concept order block detection
// 1. Find swing highs/lows using zigzag pivot method
// 2. OB = the LAST opposite-color candle BEFORE a break of structure (BOS)
// 3. Mark as mitigated when price returns into the 50% level of the OB
function calcOB(d){
  const lookback = Math.max(3, +IC.ob.lookback || 10);
  const minMove  = +IC.ob.minMove || 1.0;
  const obs = [];

  // Step 1: identify swing highs and lows
  function isSwingHigh(i){
    if(i<lookback||i>=d.length-lookback)return false;
    const hi=d[i].h;
    for(let k=i-lookback;k<=i+lookback;k++){
      if(k===i)continue;
      if(d[k]&&d[k].h>=hi)return false;
    }
    return true;
  }
  function isSwingLow(i){
    if(i<lookback||i>=d.length-lookback)return false;
    const lo=d[i].l;
    for(let k=i-lookback;k<=i+lookback;k++){
      if(k===i)continue;
      if(d[k]&&d[k].l<=lo)return false;
    }
    return true;
  }

  const swingHighs=[], swingLows=[];
  for(let i=lookback;i<d.length-lookback;i++){
    if(isSwingHigh(i))swingHighs.push({i,price:d[i].h});
    if(isSwingLow(i)) swingLows.push({i,price:d[i].l});
  }

  // Step 2: Bullish OBs — find last bearish candle before price breaks above a swing high
  swingHighs.forEach(sh=>{
    // Find a BOS: later bar that closes above sh.price
    const bosIdx=d.findIndex((bar,idx)=>idx>sh.i&&bar.c>sh.price);
    if(bosIdx<0)return;
    // Ensure move is significant
    const movePct=(d[bosIdx].c-sh.price)/sh.price*100;
    if(movePct<minMove*0.5)return;
    // Find last bearish candle in the range [sh.i-lookback*2, sh.i]
    let obIdx=-1;
    for(let k=sh.i;k>=Math.max(0,sh.i-lookback*2);k--){
      if(d[k].c<d[k].o){ // bearish candle
        obIdx=k; break;
      }
    }
    if(obIdx<0)return;
    const bar=d[obIdx];
    // OB zone: high and low of the bearish candle (use body for precision)
    const obTop=Math.max(bar.o,bar.c);
    const obBot=Math.min(bar.o,bar.c);
    // Avoid tiny bodies
    if(obTop-obBot<bar.h*0.001)return;
    // Check not already added nearby
    if(obs.some(o=>Math.abs(o.i-obIdx)<=2))return;
    obs.push({
      type:'bull', i:obIdx, bosI:bosIdx,
      top:bar.h, bottom:bar.l,        // full candle range
      bodyTop:obTop, bodyBot:obBot,   // body range (50% = equilibrium)
      eq:(obTop+obBot)/2,
      mitigated:false, partialMit:false
    });
  });

  // Step 3: Bearish OBs — last bullish candle before price breaks below swing low
  swingLows.forEach(sl=>{
    const bosIdx=d.findIndex((bar,idx)=>idx>sl.i&&bar.c<sl.price);
    if(bosIdx<0)return;
    const movePct=(sl.price-d[bosIdx].c)/sl.price*100;
    if(movePct<minMove*0.5)return;
    let obIdx=-1;
    for(let k=sl.i;k>=Math.max(0,sl.i-lookback*2);k--){
      if(d[k].c>d[k].o){ // bullish candle
        obIdx=k; break;
      }
    }
    if(obIdx<0)return;
    const bar=d[obIdx];
    const obTop=Math.max(bar.o,bar.c);
    const obBot=Math.min(bar.o,bar.c);
    if(obTop-obBot<bar.h*0.001)return;
    if(obs.some(o=>Math.abs(o.i-obIdx)<=2))return;
    obs.push({
      type:'bear', i:obIdx, bosI:bosIdx,
      top:bar.h, bottom:bar.l,
      bodyTop:obTop, bodyBot:obBot,
      eq:(obTop+obBot)/2,
      mitigated:false, partialMit:false
    });
  });

  // Step 4: Mark mitigation
  // Full mitigation: price closes BEYOND the full OB range
  // Partial mitigation: price enters the OB zone but doesn't fully close through
  obs.forEach(ob=>{
    for(let j=ob.bosI+1;j<d.length;j++){
      if(ob.type==='bull'){
        if(d[j].c<ob.bodyBot){ob.mitigated=true;break} // full mitigation
        if(d[j].l<ob.eq)ob.partialMit=true;             // partial (50%)
      } else {
        if(d[j].c>ob.bodyTop){ob.mitigated=true;break}
        if(d[j].h>ob.eq)ob.partialMit=true;
      }
    }
  });

  // Return unmitigated OBs, most recent first, capped at 8
  return obs
    .filter(ob=>!ob.mitigated)
    .sort((a,b)=>b.i-a.i)
    .slice(0,8);
}
// Candlestick patterns
function detectPatterns(d){
  const out=[];
  const body=x=>Math.abs(x.c-x.o),rng=x=>x.h-x.l||.001;
  const uSh=x=>x.h-Math.max(x.o,x.c),dSh=x=>Math.min(x.o,x.c)-x.l;
  const isUp=x=>x.c>=x.o;
  for(let i=2;i<d.length;i++){
    const cur=d[i],prv=d[i-1],pp=d[i-2];
    const bd=body(cur),rg=rng(cur),us=uSh(cur),ds=dSh(cur);
    if(bd<=rg*.1&&rg>0){out.push({i,name:'Doji',bull:null,c:IC.pat.neutralColor});continue}
    if(!isUp(prv)&&ds>=bd*2&&us<=bd*.5&&bd>0){out.push({i,name:'Hammer',bull:true,c:IC.pat.bullColor});continue}
    if(isUp(prv)&&us>=bd*2&&ds<=bd*.5&&bd>0){out.push({i,name:'Shoot★',bull:false,c:IC.pat.bearColor});continue}
    if(!isUp(prv)&&us>=bd*2&&ds<=bd*.5&&isUp(cur)){out.push({i,name:'InvHmr',bull:true,c:IC.pat.bullColor});continue}
    if(!isUp(prv)&&isUp(cur)&&cur.o<prv.c&&cur.c>prv.o&&bd>body(prv)){out.push({i,name:'BullEng',bull:true,c:IC.pat.bullColor});continue}
    if(isUp(prv)&&!isUp(cur)&&cur.o>prv.c&&cur.c<prv.o&&bd>body(prv)){out.push({i,name:'BearEng',bull:false,c:IC.pat.bearColor});continue}
    if(!isUp(pp)&&body(prv)<=rng(prv)*.25&&isUp(cur)&&cur.c>pp.o){out.push({i,name:'Morn★',bull:true,c:IC.pat.bullColor});continue}
    if(isUp(pp)&&body(prv)<=rng(prv)*.25&&!isUp(cur)&&cur.c<pp.o){out.push({i,name:'Eve★',bull:false,c:IC.pat.bearColor});continue}
    if(i>=4&&[d[i-2],d[i-1],cur].every(x=>isUp(x)&&body(x)>rng(x)*.5)){out.push({i,name:'3Sol',bull:true,c:IC.pat.bullColor});continue}
    if(i>=4&&[d[i-2],d[i-1],cur].every(x=>!isUp(x)&&body(x)>rng(x)*.5)){out.push({i,name:'3Crow',bull:false,c:IC.pat.bearColor});continue}
    if(bd<=rg*.25&&us>=rg*.2&&ds>=rg*.2){out.push({i,name:'SpinTop',bull:null,c:IC.pat.neutralColor});continue}
  }
  return out;
}

function calcRSI_sig(d,p=14){
  let aG=0,aL=0;const r=new Array(d.length).fill(null);
  for(let i=1;i<d.length;i++){
    const df=d[i].c-d[i-1].c,g=df>0?df:0,l=df<0?-df:0;
    if(i<p){aG+=g/p;aL+=l/p}
    else if(i===p){aG+=g/p;aL+=l/p;r[i]=100-100/(1+(aL===0?1e9:aG/aL))}
    else{aG=(aG*(p-1)+g)/p;aL=(aL*(p-1)+l)/p;r[i]=100-100/(1+(aL===0?1e9:aG/aL))}
  }
  return r;
}

// ATR – Average True Range
function calcATR(d,p=14){
  const tr=d.map((b,i)=>{
    if(i===0)return b.h-b.l;
    return Math.max(b.h-b.l,Math.abs(b.h-d[i-1].c),Math.abs(b.l-d[i-1].c));
  });
  const atr=new Array(d.length).fill(null);
  let sum=0;
  for(let i=0;i<p&&i<tr.length;i++)sum+=tr[i];
  atr[p-1]=sum/p;
  for(let i=p;i<d.length;i++)atr[i]=(atr[i-1]*(p-1)+tr[i])/p;
  return atr;
}

// ADX – Average Directional Index (trend strength filter)
function calcADX(d,p=14){
  const adx=new Array(d.length).fill(null);
  if(d.length<p*2)return adx;
  const dmP=new Array(d.length).fill(0),dmM=new Array(d.length).fill(0);
  for(let i=1;i<d.length;i++){
    const upMove=d[i].h-d[i-1].h,dnMove=d[i-1].l-d[i].l;
    dmP[i]=upMove>dnMove&&upMove>0?upMove:0;
    dmM[i]=dnMove>upMove&&dnMove>0?dnMove:0;
  }
  const atr=calcATR(d,p);
  let diP=0,diM=0,dx=0,sumDx=0;
  for(let i=1;i<p;i++){diP+=dmP[i];diM+=dmM[i]}
  for(let i=p;i<d.length;i++){
    diP=(diP*(p-1)+dmP[i])/p;
    diM=(diM*(p-1)+dmM[i])/p;
    const a=atr[i]||1;
    const piP=100*diP/a,piM=100*diM/a;
    const dxVal=Math.abs(piP-piM)/(piP+piM||1)*100;
    if(i<p*2){sumDx+=dxVal}
    else if(i===p*2){adx[i]=sumDx/p;dx=adx[i]}
    else{dx=(dx*(p-1)+dxVal)/p;adx[i]=dx}
  }
  return adx;
}

// Supertrend
function calcSupertrend(d,p=10,mult=3){
  const atr=calcATR(d,p);
  const up=new Array(d.length).fill(null);
  const dn=new Array(d.length).fill(null);
  const trend=new Array(d.length).fill(1); // 1=bull,-1=bear
  for(let i=p;i<d.length;i++){
    const mid=(d[i].h+d[i].l)/2,a=atr[i]*mult;
    let bu=mid-a,bd=mid+a;
    if(i>p){
      bu=bu>up[i-1]||d[i-1].c<up[i-1]?bu:up[i-1];
      bd=bd<dn[i-1]||d[i-1].c>dn[i-1]?bd:dn[i-1];
    }
    up[i]=bu;dn[i]=bd;
    if(i>p){
      if(d[i].c>dn[i-1])trend[i]=1;
      else if(d[i].c<up[i-1])trend[i]=-1;
      else trend[i]=trend[i-1];
    }
  }
  return{up,dn,trend};
}

// MACD
function calcMACD(d,fast=12,slow=26,sig=9){
  const emaF=calcEMA(d,fast),emaS=calcEMA(d,slow);
  const macd=d.map((_,i)=>emaF[i]!=null&&emaS[i]!=null?emaF[i]-emaS[i]:null);
  // Signal line: EMA of macd
  const k=2/(sig+1);let e=null;
  const sigLine=macd.map((v,i)=>{
    if(v==null)return null;
    if(e===null){
      // Initialize with SMA of first `sig` valid values
      const start=macd.findIndex(x=>x!=null);
      if(i-start<sig-1)return null;
      if(i-start===sig-1){e=macd.slice(start,i+1).reduce((a,b)=>a+b,0)/sig;return e}
    }
    e=v*k+e*(1-k);return e;
  });
  const hist=macd.map((v,i)=>v!=null&&sigLine[i]!=null?v-sigLine[i]:null);
  return{macd,signal:sigLine,hist};
}

// OBV – On-Balance Volume
function calcOBV(d){
  const obv=new Array(d.length).fill(0);
  for(let i=1;i<d.length;i++){
    if(d[i].c>d[i-1].c)obv[i]=obv[i-1]+(d[i].v||0);
    else if(d[i].c<d[i-1].c)obv[i]=obv[i-1]-(d[i].v||0);
    else obv[i]=obv[i-1];
  }
  return obv;
}

// Stochastic %K and %D
function calcStoch(d,kPeriod=14,dPeriod=3){
  const k=new Array(d.length).fill(null);
  const dm=new Array(d.length).fill(null);
  for(let i=kPeriod-1;i<d.length;i++){
    const sl=d.slice(i-kPeriod+1,i+1);
    const hh=Math.max(...sl.map(b=>b.h)),ll=Math.min(...sl.map(b=>b.l));
    k[i]=hh===ll?50:(d[i].c-ll)/(hh-ll)*100;
  }
  // %D = SMA of %K
  for(let i=kPeriod+dPeriod-2;i<d.length;i++){
    const sl=k.slice(i-dPeriod+1,i+1).filter(x=>x!=null);
    if(sl.length===dPeriod)dm[i]=sl.reduce((a,b)=>a+b,0)/dPeriod;
  }
  return{k,d:dm};
}

// CCI – Commodity Channel Index
function calcCCI(d,p=20){
  const cci=new Array(d.length).fill(null);
  for(let i=p-1;i<d.length;i++){
    const sl=d.slice(i-p+1,i+1);
    const tp=sl.map(b=>(b.h+b.l+b.c)/3);
    const mean=tp.reduce((a,b)=>a+b,0)/p;
    const mad=tp.reduce((a,b)=>a+Math.abs(b-mean),0)/p;
    cci[i]=(tp[tp.length-1]-mean)/(0.015*mad||1);
  }
  return cci;
}

// VWAP deviation (for signal engine – uses volume-weighted mean)
function calcVWAP_full(d){
  let cv=0,ctpv=0;
  return d.map(b=>{
    const tp=(b.h+b.l+b.c)/3;
    ctpv+=tp*(b.v||1);cv+=b.v||1;
    return ctpv/cv;
  });
}

// Linear Regression Slope (momentum direction)
function calcLRSlope(d,p=14){
  const slope=new Array(d.length).fill(null);
  for(let i=p-1;i<d.length;i++){
    const sl=d.slice(i-p+1,i+1).map(b=>b.c);
    const n=sl.length,xm=(n-1)/2;
    let num=0,den=0;
    sl.forEach((y,x)=>{num+=(x-xm)*(y-sl.reduce((a,b)=>a+b,0)/n);den+=(x-xm)**2});
    slope[i]=den?num/den:0;
  }
  return slope;
}

// Pivot points (daily high/low for S/R levels)
function calcPivots(d){
  if(d.length<2)return{pp:null,r1:null,r2:null,s1:null,s2:null};
  const prev=d[d.length-2];
  const pp=(prev.h+prev.l+prev.c)/3;
  return{
    pp,
    r1:2*pp-prev.l, r2:pp+(prev.h-prev.l),
    s1:2*pp-prev.h, s2:pp-(prev.h-prev.l)
  };
}

// Detect MACD divergence (bullish: price new low but MACD higher low)
function detectMACDDivergence(d,macdArr,lookback=20){
  const bull=[],bear=[];
  for(let i=lookback;i<d.length;i++){
    const sl=d.slice(i-lookback,i+1);
    const mSl=macdArr.slice(i-lookback,i+1).filter(x=>x!=null);
    if(mSl.length<5)continue;
    // Bullish: price lower low, MACD higher low
    const pLow=Math.min(...sl.map(b=>b.l));
    const mLow=Math.min(...mSl);
    const prevPLow=Math.min(...d.slice(i-lookback*2,i-lookback+1).map(b=>b.l));
    const prevMLow=macdArr.slice(i-lookback*2,i-lookback+1).filter(x=>x!=null);
    if(prevMLow.length&&pLow<prevPLow&&mLow>Math.min(...prevMLow))bull.push(i);
    // Bearish: price higher high, MACD lower high
    const pHigh=Math.max(...sl.map(b=>b.h));
    const mHigh=Math.max(...mSl);
    const prevPHigh=Math.max(...d.slice(i-lookback*2,i-lookback+1).map(b=>b.h));
    const prevMHigh=macdArr.slice(i-lookback*2,i-lookback+1).filter(x=>x!=null);
    if(prevMHigh.length&&pHigh>prevPHigh&&mHigh<Math.max(...prevMHigh))bear.push(i);
  }
  return{bull,bear};
}

// Z-score mean reversion
function calcZScore(d,p=20){
  return d.map((_,i)=>{
    if(i<p-1)return null;
    const sl=d.slice(i-p+1,i+1).map(b=>b.c);
    const mean=sl.reduce((a,b)=>a+b,0)/p;
    const std=Math.sqrt(sl.reduce((a,b)=>a+(b-mean)**2,0)/p)||1;
    return(d[i].c-mean)/std;
  });
}

// Gap detection
function detectGaps(d){
  const gaps=[];
  for(let i=1;i<d.length;i++){
    if(d[i].o>d[i-1].h)gaps.push({i,type:'up',size:(d[i].o-d[i-1].h)/d[i-1].h});
    if(d[i].o<d[i-1].l)gaps.push({i,type:'dn',size:(d[i-1].l-d[i].o)/d[i-1].l});
  }
  return gaps;
}

// Consecutive candle count
function countConsecutive(d,i,dir){
  let count=0;
  for(let j=i;j>=0;j--){
    if(dir==='up'&&d[j].c>=d[j].o)count++;
    else if(dir==='dn'&&d[j].c<d[j].o)count++;
    else break;
  }
  return count;
}

// Volatility squeeze (BB inside Keltner)
function calcSqueeze(d,bbP=20,bbMult=2,kP=20,kMult=1.5){
  const bb=calcBB(d,bbP,bbMult);
  const atr=calcATR(d,kP);
  const ma=calcMA(d,kP);
  return d.map((_,i)=>{
    if(bb[i].u==null||!atr[i]||!ma[i])return null;
    const kU=ma[i]+kMult*atr[i],kL=ma[i]-kMult*atr[i];
    return bb[i].u<kU&&bb[i].l>kL; // true = squeeze
  });
}

// ══════════════════════════════════════════════════════════════
//  UPGRADED BUY/SELL SIGNAL ENGINE  (20 factors)
// ══════════════════════════════════════════════════════════════
function calcSignals(d){
  // Need at least enough bars to warm up all indicators
  // But we'll emit signals even with fewer bars using safe null-checks
  if(d.length<30)return[];
  const hasEnough=d.length>=55;

  // Pre-compute all indicators once
  const ma20=calcMA(d,20),ma50=calcMA(d,50),ma200=calcMA(d,200);
  const ema12=calcEMA(d,12),ema26=calcEMA(d,26);
  const rsi=calcRSI_sig(d,14);
  const adx=calcADX(d,14);
  const atr=calcATR(d,14);
  const st=calcSupertrend(d,+IC.supertrend.atrPeriod||10,+IC.supertrend.multiplier||3);
  const {macd:macdLine,signal:macdSig,hist:macdHist}=calcMACD(d,12,26,9);
  const stoch=calcStoch(d,14,3);
  const cci=calcCCI(d,20);
  const obv=calcOBV(d);
  const obvMA=calcMA(d.map((_,i)=>({c:obv[i],o:0,h:0,l:0,v:0})),20);
  const vwap=calcVWAP_full(d);
  const lrSlope=calcLRSlope(d,14);
  const zScore=calcZScore(d,20);
  const squeeze=calcSqueeze(d);
  const sr=calcSR(d);
  const pats=detectPatterns(d);
  const fvgs=calcFVG(d);
  const obs=calcOB(d);
  const pivots=calcPivots(d);
  const gaps=detectGaps(d);
  const macdDiv=detectMACDDivergence(d,macdLine);

  const signals=[];
  const minStr=+IC.sig.minStrength;

  // Start from enough bars for warmup, but at least bar 10 if data is short
  const startI=hasEnough?55:Math.min(30,Math.floor(d.length*.4));

  for(let i=startI;i<d.length;i++){
    const bar=d[i],prev=d[i-1];

    // ── INDEPENDENT FACTOR GROUPS ──
    // Each group contributes at most its group weight, preventing correlated
    // factors from stacking artificially. This is the key accuracy improvement.
    // Group A: Trend direction (max +3 buy or +3 sell)
    // Group B: Momentum (max +3)
    // Group C: Volume (max +2)
    // Group D: Price structure (max +3)
    // Group E: Statistical (max +2)
    // Total max per side: 13 — need minStr to emit

    let buyScore=0,sellScore=0;
    const buyR=[],sellR=[];

    const adxVal=adx[i]||0;
    const trendStrong=adxVal>22;
    const trendWeak=adxVal<18;

    // ══════════════════════════════════════════════════════
    // GROUPED, INDEPENDENT FACTOR SCORING
    // 5 groups — each capped so correlated signals don't stack
    // Group A: Trend    (max ±4)
    // Group B: Momentum (max ±4)
    // Group C: Volume   (max ±3)
    // Group D: Structure(max ±4)
    // Group E: Stats    (max ±3)
    // Total max one side: 18. Default minStr=4
    // ══════════════════════════════════════════════════════

    // ── GROUP A: TREND ──────────────────────────────────
    let gA=0;
    // A1. Supertrend flip (strongest single signal)
    if(st.trend[i]!=null&&i>0&&st.trend[i-1]!=null){
      if(st.trend[i]===1&&st.trend[i-1]===-1){gA=4;buyR.push('SuperTrend↑')}
      else if(st.trend[i]===-1&&st.trend[i-1]===1){gA=-4;sellR.push('SuperTrend↓')}
      else gA+=(st.trend[i]===1?1:-1);
    }
    // A2. MA20/50 cross — add only if not already capped by ST flip
    if(Math.abs(gA)<4&&ma20[i]&&ma50[i]&&ma20[i-1]&&ma50[i-1]){
      if(ma20[i]>ma50[i]&&ma20[i-1]<=ma50[i-1]){gA+=3;buyR.push('MA Cross↑')}
      else if(ma20[i]<ma50[i]&&ma20[i-1]>=ma50[i-1]){gA-=3;sellR.push('MA Cross↓')}
    }
    // A3. EMA12/26 cross
    if(Math.abs(gA)<4&&ema12[i]&&ema26[i]&&ema12[i-1]&&ema26[i-1]){
      if(ema12[i]>ema26[i]&&ema12[i-1]<=ema26[i-1]){gA+=2;buyR.push('EMA↑')}
      else if(ema12[i]<ema26[i]&&ema12[i-1]>=ema26[i-1]){gA-=2;sellR.push('EMA↓')}
    }
    // A4. Price vs MA50/200 bias (very low weight)
    if(ma50[i]) gA+=(bar.c>ma50[i]?0.5:-0.5);
    if(ma200[i])gA+=(bar.c>ma200[i]?0.3:-0.3);
    // A5. MA50 slope (multi-bar direction)
    if(ma50[i]&&ma50[Math.max(0,i-5)]){
      const slope=(ma50[i]-ma50[i-5])/ma50[i-5];
      gA+=(slope>0.001?0.5:slope<-0.001?-0.5:0);
    }
    gA=clamp(gA,-4,4);

    // ── GROUP B: MOMENTUM ────────────────────────────────
    let gB=0;
    // B1. MACD cross
    if(macdLine[i]!=null&&macdSig[i]!=null&&macdLine[i-1]!=null&&macdSig[i-1]!=null){
      if(macdLine[i]>macdSig[i]&&macdLine[i-1]<=macdSig[i-1]){gB+=3;buyR.push('MACD↑')}
      else if(macdLine[i]<macdSig[i]&&macdLine[i-1]>=macdSig[i-1]){gB-=3;sellR.push('MACD↓')}
      if(macdHist[i]!=null&&macdHist[i-1]!=null)
        gB+=(macdHist[i]>macdHist[i-1]?0.5:-0.5);
    }
    // B2. MACD divergence (rare but high-quality)
    if(macdDiv.bull.includes(i)){gB+=4;buyR.push('MACD Div↑')}
    if(macdDiv.bear.includes(i)){gB-=4;sellR.push('MACD Div↓')}
    // B3. RSI — only reversals from extreme zones
    if(rsi[i]!=null&&rsi[i-1]!=null){
      if(rsi[i]<30&&rsi[i]>rsi[i-1]){gB+=2;buyR.push('RSI OS')}
      else if(rsi[i]>70&&rsi[i]<rsi[i-1]){gB-=2;sellR.push('RSI OB')}
      else gB+=(rsi[i]>55?0.5:rsi[i]<45?-0.5:0);
    }
    // B4. RSI divergence (10-bar window)
    if(i>=10&&rsi[i]!=null){
      const rWin=rsi.slice(i-10,i+1).filter(x=>x!=null);
      const pWin=d.slice(i-10,i+1);
      if(rWin.length>=5){
        if(bar.l<=Math.min(...pWin.map(b=>b.l))&&rsi[i]>Math.min(...rWin)){gB+=2;buyR.push('RSI Div↑')}
        if(bar.h>=Math.max(...pWin.map(b=>b.h))&&rsi[i]<Math.max(...rWin)){gB-=2;sellR.push('RSI Div↓')}
      }
    }
    // B5. Stochastic cross from extreme zones only
    if(stoch.k[i]!=null&&stoch.d[i]!=null&&stoch.k[i-1]!=null&&stoch.d[i-1]!=null){
      if(stoch.k[i]>stoch.d[i]&&stoch.k[i-1]<stoch.d[i-1]&&stoch.k[i]<35){gB+=2;buyR.push('Stoch↑')}
      if(stoch.k[i]<stoch.d[i]&&stoch.k[i-1]>stoch.d[i-1]&&stoch.k[i]>65){gB-=2;sellR.push('Stoch↓')}
    }
    // B6. CCI reversal from extreme
    if(cci[i]!=null&&cci[i-1]!=null){
      if(cci[i]>-100&&cci[i-1]<=-100){gB+=1;buyR.push('CCI Rev↑')}
      if(cci[i]<100&&cci[i-1]>=100){gB-=1;sellR.push('CCI Rev↓')}
    }
    gB=clamp(gB,-4,4);

    // ── GROUP C: VOLUME ──────────────────────────────────
    let gC=0;
    const avgVol=d.slice(Math.max(0,i-20),i).reduce((a,b)=>a+(b.v||0),0)/20||1;
    const volSurge=bar.v>avgVol*1.5;
    // C1. OBV cross its MA
    if(obvMA[i]!=null&&i>0){
      if(obv[i]>obvMA[i]&&obv[i-1]<=obvMA[i]){gC+=2;buyR.push('OBV↑')}
      else if(obv[i]<obvMA[i]&&obv[i-1]>=obvMA[i]){gC-=2;sellR.push('OBV↓')}
      else gC+=(obv[i]>obvMA[i]?0.5:-0.5);
    }
    // C2. High-volume directional breakout
    const rHigh=Math.max(...d.slice(Math.max(0,i-15),i).map(b=>b.h));
    const rLow =Math.min(...d.slice(Math.max(0,i-15),i).map(b=>b.l));
    if(bar.h>rHigh&&volSurge){gC+=3;buyR.push('HV Break↑')}
    if(bar.l<rLow &&volSurge){gC-=3;sellR.push('HV Break↓')}
    // C3. Volume spike in bar direction (confirmation only)
    else if(volSurge) gC+=(bar.c>=bar.o?1:-1);
    gC=clamp(gC,-3,3);

    // ── GROUP D: PRICE STRUCTURE ─────────────────────────
    let gD=0;
    // D1. Candlestick pattern
    const pat=pats.find(p=>p.i===i);
    if(pat){
      if(pat.bull===true){gD+=2;buyR.push(pat.name)}
      else if(pat.bull===false){gD-=2;sellR.push(pat.name)}
    }
    // D2. Inside bar compression breakout (high quality)
    if(i>1&&d[i-1].h<=d[i-2].h&&d[i-1].l>=d[i-2].l){
      if(bar.c>d[i-1].h){gD+=3;buyR.push('IB Break↑')}
      else if(bar.c<d[i-1].l){gD-=3;sellR.push('IB Break↓')}
    }
    // D3. Squeeze breakout
    if(squeeze[i]===false&&squeeze[i-1]===true){
      gD+=(bar.c>=bar.o?2:-2);
      if(bar.c>=bar.o)buyR.push('Squeeze↑'); else sellR.push('Squeeze↓');
    }
    // D4. S&R bounce/reject (deduplicated — max ±1)
    let srHit=0;
    sr.forEach(lv=>{
      if(srHit!==0)return;
      const dist=Math.abs(bar.c-lv.price)/bar.c;
      if(dist<0.009){
        if(lv.type==='S'&&bar.c>prev.c){srHit=1;buyR.push('S↑')}
        if(lv.type==='R'&&bar.c<prev.c){srHit=-1;sellR.push('R↓')}
      }
    });
    gD+=srHit;
    // D5. OB/FVG zone — max ±1 combined
    let obFvg=0;
    obs.forEach(ob=>{
      if(ob.type==='bull'&&bar.l>=ob.bottom&&bar.l<=ob.top&&obFvg===0){obFvg=1;buyR.push('OB↑')}
      if(ob.type==='bear'&&bar.h>=ob.bottom&&bar.h<=ob.top&&obFvg===0){obFvg=-1;sellR.push('OB↓')}
    });
    if(obFvg===0){
      fvgs.forEach(g=>{
        if(g.type==='bull'&&bar.l<=g.top&&bar.l>=g.bottom&&obFvg===0){obFvg=1;buyR.push('FVG↑')}
        if(g.type==='bear'&&bar.h>=g.bottom&&bar.h<=g.top&&obFvg===0){obFvg=-1;sellR.push('FVG↓')}
      });
    }
    gD+=obFvg;
    // D6. Consecutive candle exhaustion (reversal context)
    const consUp=countConsecutive(d,i-1,'up'),consDn=countConsecutive(d,i-1,'dn');
    if(consDn>=4&&bar.c>bar.o){gD+=1;buyR.push('Exhaust↑')}
    if(consUp>=4&&bar.c<bar.o){gD-=1;sellR.push('Exhaust↓')}
    // D7. Gap fill
    gaps.filter(g=>g.i===i).forEach(g=>{
      if(g.type==='dn'){gD+=1;buyR.push('Gap↑')}
      if(g.type==='up'){gD-=1;sellR.push('Gap↓')}
    });
    // D8. Ichimoku cloud position + TK cross
    if(i>=52){
      const ichi=calcIchimoku(d,9,26,52);
      const sA=ichi.senkouA[i],sB=ichi.senkouB[i];
      const ten=ichi.tenkan[i],kij=ichi.kijun[i];
      if(sA&&sB){gD+=(bar.c>Math.max(sA,sB)?1:bar.c<Math.min(sA,sB)?-1:0)}
      if(ten&&kij&&ichi.tenkan[i-1]&&ichi.kijun[i-1]){
        if(ten>kij&&ichi.tenkan[i-1]<=ichi.kijun[i-1]){gD+=2;buyR.push('Ichi↑')}
        if(ten<kij&&ichi.tenkan[i-1]>=ichi.kijun[i-1]){gD-=2;sellR.push('Ichi↓')}
      }
    }
    gD=clamp(gD,-4,4);

    // ── GROUP E: STATISTICAL / MEAN REVERSION ────────────
    let gE=0;
    // E1. Z-score extreme reversion
    if(zScore[i]!=null&&lrSlope[i]!=null){
      if(zScore[i]<-1.8&&lrSlope[i]>0){gE+=2;buyR.push('Z-Rev↑')}
      else if(zScore[i]>1.8&&lrSlope[i]<0){gE-=2;sellR.push('Z-Rev↓')}
    }
    // E2. VWAP deviation (stretched → revert)
    if(vwap[i]){
      const vd=(bar.c-vwap[i])/vwap[i];
      if(vd<-0.025&&bar.c>prev.c){gE+=1;buyR.push('VWAP↑')}
      else if(vd>0.025&&bar.c<prev.c){gE-=1;sellR.push('VWAP↓')}
    }
    // E3. LR slope acceleration
    if(lrSlope[i]!=null&&lrSlope[i-1]!=null){
      gE+=(lrSlope[i]>0&&lrSlope[i]>lrSlope[i-1]?0.5:
           lrSlope[i]<0&&lrSlope[i]<lrSlope[i-1]?-0.5:0);
    }
    // E4. MA200 extreme deviation (reversion opportunity)
    if(ma200[i]){
      const dev=(bar.c-ma200[i])/ma200[i];
      if(dev<-0.12&&lrSlope[i]>0){gE+=1;buyR.push('MA200↑')}
      if(dev>0.12&&lrSlope[i]<0){gE-=1;sellR.push('MA200↓')}
    }
    // E5. Pivot S1/R1 proximity
    if(pivots.pp){
      [{p:pivots.s1,t:'S1',dir:1},{p:pivots.r1,t:'R1',dir:-1}].forEach(lv=>{
        if(!lv.p)return;
        const dist=Math.abs(bar.c-lv.p)/bar.c;
        if(dist<0.008){
          if(lv.dir===1&&bar.c>prev.c){gE+=1;buyR.push(lv.t+'↑')}
          if(lv.dir===-1&&bar.c<prev.c){gE-=1;sellR.push(lv.t+'↓')}
        }
      });
    }
    gE=clamp(gE,-3,3);

    // ══ ATR DEAD-MARKET FILTER ══
    const atrV=atr[i]||0;
    const avgC=d.slice(Math.max(0,i-20),i).reduce((a,b)=>a+b.c,0)/20||1;
    if(atrV/avgC<0.002)continue;

    // ══ RAW SCORES ══
    const rawBuy =Math.max(0,gA)+Math.max(0,gB)+Math.max(0,gC)+Math.max(0,gD)+Math.max(0,gE);
    const rawSell=Math.max(0,-gA)+Math.max(0,-gB)+Math.max(0,-gC)+Math.max(0,-gD)+Math.max(0,-gE);

    // ══ MARKET REGIME ADJUSTMENT ══
    let eBuy=rawBuy,eSell=rawSell;
    if(trendWeak){
      // Ranging market: dampen trend signals, boost reversion
      eBuy =rawBuy*.65+(Math.max(0,gE)*0.5);
      eSell=rawSell*.65+(Math.max(0,-gE)*0.5);
    } else if(!trendStrong){
      eBuy=rawBuy*.82;eSell=rawSell*.82;
    }

    // ══ CANDLE CLOSE CONFIRMATION ══
    // Signal bar must close in its direction — prevents mid-candle noise
    const closedBull=bar.c>bar.o;
    const closedBear=bar.c<bar.o;

    // ══ EMIT ══
    const lastSig=signals[signals.length-1];
    const gapBars=lastSig?i-lastSig.i:99;
    const minStr=+IC.sig.minStrength;
    const minGap=trendStrong?4:7;
    const margin=eBuy-eSell;

    if(eBuy>=minStr&&margin>=2&&closedBull&&gapBars>=minGap){
      const str=clamp(Math.ceil(eBuy/3.5),1,5);
      const regime=trendStrong?'trend':trendWeak?'range':'mixed';
      signals.push({i,type:'BUY',strength:str,reasons:buyR.slice(0,6),adx:adxVal.toFixed(1),regime});
    } else if(eSell>=minStr&&(-margin)>=2&&closedBear&&gapBars>=minGap){
      const str=clamp(Math.ceil(eSell/3.5),1,5);
      const regime=trendStrong?'trend':trendWeak?'range':'mixed';
      signals.push({i,type:'SELL',strength:str,reasons:sellR.slice(0,6),adx:adxVal.toFixed(1),regime});
    }
  }
  return signals;
}

// AVWAP
function calcAVWAP(d,anchorIdx){
  let cv=0,ctpv=0;
  return d.map((bar,i)=>{
    if(i<anchorIdx)return null;
    const tp=(bar.h+bar.l+bar.c)/3;
    ctpv+=tp*(bar.v||0);cv+=bar.v||0;
    return cv>0?ctpv/cv:null;
  });
}
// Fixed Range Volume Profile
function calcFRVP(d,i0,i1,bins=30){
  const slice=d.slice(Math.min(i0,i1),Math.max(i0,i1)+1);
  return calcVP(slice,bins);
}

// ── Swing High/Low ──
function calcSwingHL(d,lookback=5){
  const highs=[],lows=[];
  for(let i=lookback;i<d.length-lookback;i++){
    const sl=d.slice(i-lookback,i+lookback+1);
    if(d[i].h===Math.max(...sl.map(b=>b.h)))highs.push({i,price:d[i].h});
    if(d[i].l===Math.min(...sl.map(b=>b.l)))lows.push({i,price:d[i].l});
  }
  return{highs,lows};
}
// ── Volume Delta ──
function calcVolDelta(d){
  return d.map(b=>{
    if(!b.v)return{buy:0,sell:0,delta:0};
    const range=b.h-b.l||1;
    const buyRatio=(b.c-b.l)/range;
    const buy=b.v*buyRatio,sell=b.v*(1-buyRatio);
    return{buy,sell,delta:buy-sell};
  });
}

// ════════════════════════════════════════════════════════════
//  AMFD CYCLE DETECTOR
//  Detects: Accumulation → Manipulation → FVG → Distribution
//
//  Algorithm based on ICT (Inner Circle Trader) / SMC framework:
//
//  ACCUMULATION  — Tight consolidation; smart money building position.
//                  Detected as: low ATR range over N bars, price oscillates
//                  inside a narrow band (high-low range < 1.5× avg ATR).
//
//  MANIPULATION  — Liquidity grab / stop hunt BEFORE the real move.
//                  Detected as: a candle that spikes significantly beyond
//                  the accumulation range (wick beyond range by > ATR×mult),
//                  then closes BACK inside or near the range.
//                  Classic "stop raid" pattern.
//
//  FVG           — Fair Value Gap left by the impulsive move after manipulation.
//                  Detected as per existing FVG logic: gap between candle[i-2]
//                  and candle[i] (3-candle imbalance). The FVG here is
//                  specifically the one that immediately follows the manipulation.
//
//  DISTRIBUTION  — Smart money unloading. Detected as: impulsive directional
//                  move after the FVG (close > accumulation range top or
//                  close < accumulation range bottom), sustained for 2+ bars,
//                  with above-average volume.
//
//  Returns: array of AMFD cycle objects, each covering a bar range.
// ════════════════════════════════════════════════════════════
function calcAMFD(d){
  const cfg = IC.amfd;
  if(!cfg||!d||d.length<30) return [];

  const atr  = calcATR(d, 14);
  const cycles = [];
  const usedBars = new Set(); // prevent overlapping cycles

  const accumLB  = Math.max(5, +cfg.accumLookback || 15);
  const manipMul = +cfg.manipThreshold || 1.5;
  const minAccum = Math.max(3, +cfg.minAccumBars  || 5);

  // Slide a window across bars looking for the pattern
  let i = accumLB;
  while(i < d.length - 4){
    if(usedBars.has(i)){ i++; continue; }

    // ── PHASE 1: Find Accumulation ──────────────────────────
    // Look back accumLB bars for a tight range
    const accStart = Math.max(0, i - accumLB);
    const accSlice = d.slice(accStart, i);
    if(accSlice.length < minAccum){ i++; continue; }

    const accHighs=accSlice.map(b=>b.h).filter(Boolean);
    const accLows=accSlice.map(b=>b.l).filter(Boolean);
    if(!accHighs.length||!accLows.length){i++;continue;}
    const rangeH  = Math.max(...accHighs);
    const rangeL  = Math.min(...accLows);
    const rangeSz = rangeH - rangeL;
    const avgATR  = accSlice.reduce((s,_,k)=>{
      const ai = accStart+k;
      return s + (atr[ai]||0);
    }, 0) / accSlice.length;

    // Accumulation = price contained in a narrow band
    // Band must be tight: range < 2× avg ATR
    if(avgATR <= 0 || rangeSz > avgATR * 2.2){ i++; continue; }

    // Most bars should close inside the band (allow 1 outlier)
    const insideBars = accSlice.filter(b=>b.c>=rangeL&&b.c<=rangeH).length;
    if(insideBars < accSlice.length - 1){ i++; continue; }

    // Check volume: accumulation usually has declining or below-avg volume
    const avgVol = d.slice(Math.max(0,accStart-20),accStart)
      .reduce((s,b)=>s+(b.v||0),0)/20 || 1;
    const accVol = accSlice.reduce((s,b)=>s+(b.v||0),0)/accSlice.length;
    // Not strictly required — just informational for scoring

    // ── PHASE 2: Find Manipulation (stop hunt) ───────────────
    // Check bar at i and i+1 for a spike beyond the range
    let manipIdx = -1, manipDir = 0; // +1=bullish trap(fake low), -1=bearish trap(fake high)
    for(let m = i; m < Math.min(i+4, d.length); m++){
      const bar = d[m];
      // Bearish manipulation: wick spikes UP above rangeH, then closes back in/below
      if(bar.h > rangeH + avgATR*manipMul*0.5 && bar.c < rangeH + avgATR*0.3){
        // Price faked above, closed back — bullish setup incoming
        manipIdx = m; manipDir = 1; break;
      }
      // Bullish manipulation: wick spikes DOWN below rangeL, then closes back in/above
      if(bar.l < rangeL - avgATR*manipMul*0.5 && bar.c > rangeL - avgATR*0.3){
        // Price faked below, closed back — bearish setup incoming... wait that's inverted
        // In SMC: price raids sell-side liquidity (fake low) before going UP (bullish)
        manipIdx = m; manipDir = 1; break;
      }
    }
    if(manipIdx < 0){ i++; continue; }

    // ── PHASE 3: Find FVG after manipulation ─────────────────
    let fvgObj = null;
    for(let f = manipIdx+1; f < Math.min(manipIdx+6, d.length-1); f++){
      const a=d[f-1], b2=d[f], c=d[f+1]||d[f];
      // Bullish FVG: c.l > a.h (gap between bottom of candle 3 and top of candle 1)
      if(c.l > a.h && b2.c > b2.o){
        fvgObj = { type:'bull', i0:f-1, i2:f+1, top:c.l, bottom:a.h, midI:f }; break;
      }
      // Bearish FVG: c.h < a.l
      if(c.h < a.l && b2.c < b2.o){
        fvgObj = { type:'bear', i0:f-1, i2:f+1, top:a.l, bottom:c.h, midI:f }; break;
      }
    }
    // FVG is strongly preferred but not strictly required (some cycles skip it)
    const fvgStart = fvgObj ? fvgObj.midI : manipIdx+1;

    // ── PHASE 4: Find Distribution (impulsive move) ───────────
    let distStart = -1, distEnd = -1;
    const lookFwd = Math.min(fvgStart+15, d.length);
    for(let dd = fvgStart+1; dd < lookFwd; dd++){
      const mv = d[dd];
      const isMover = manipDir===1
        ? mv.c > rangeH + avgATR*0.5   // bullish dist: breaks above range
        : mv.c < rangeL - avgATR*0.5;  // bearish dist: breaks below range
      if(isMover && (mv.v||0) > avgVol*0.8){
        if(distStart<0) distStart = dd;
        distEnd = dd;
        // Extend distribution as long as price keeps moving
        if(dd+1<d.length){
          const next=d[dd+1];
          const still = manipDir===1?next.c>rangeH:next.c<rangeL;
          if(!still) break;
        }
      } else if(distStart>=0) break;
    }
    if(distStart<0){ i=manipIdx+1; continue; } // no distribution found

    // ── Build cycle object ────────────────────────────────────
    const cycle = {
      accumStart,
      accumEnd:  i-1,
      rangeH, rangeL,
      manipIdx, manipDir,
      fvg: fvgObj,
      distStart, distEnd,
      avgATR,
    };
    cycles.push(cycle);

    // Mark bars as used to avoid re-detection
    for(let u=accStart; u<=distEnd; u++) usedBars.add(u);
    i = distEnd+1;
  }

  return cycles.slice(-6); // show last 6 cycles max
}

// ════════════════════════════════════════════════════════════
//  CANVAS CHART ENGINE
// ════════════════════════════════════════════════════════════
const canvas=document.getElementById('chart-canvas');
const ctx=canvas.getContext('2d');
let DPR=devicePixelRatio||1;

function resize(){
  const outer=document.getElementById('canvas-outer');
  DPR=devicePixelRatio||1;
  const W=outer.clientWidth,H=outer.clientHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  draw();
}

function getLayout(){
  const W=canvas.width/DPR,H=canvas.height/DPR;
  const lPad=0,rPad=90,tPad=10;
  const pH=S.panelHeights;
  const volH   = IC.vol.vis        ? pH.vol   : 0;
  const macdH  = IC.macdPanel?.vis ? pH.macd  : 0;
  const stochH = IC.stochPanel?.vis? pH.stoch : 0;
  const vdeltH = IC.volDelta?.vis  ? pH.vdelta: 0;
  const bPad   = volH + macdH + stochH + vdeltH + 22;
  const cW=W-lPad-rPad, cH=H-tPad-bPad;
  return{W,H,lPad,rPad,tPad,volH,macdH,stochH,vdeltH,bPad,cW,cH};
}

// Returns y-coordinate of each bottom panel's top edge
function panelY(L){
  const base=L.tPad+L.cH;
  return{
    vol:   base,
    vdelta:base + L.volH,
    macd:  base + L.volH + L.vdeltH,
    stoch: base + L.volH + L.vdeltH + L.macdH,
  };
}

function dToX(idx,L){
  const n=S.viewEnd-S.viewStart;
  return L.lPad+(idx-S.viewStart)/n*L.cW;
}
function pToY(p,mn,mx,L){
  const pad=(mx-mn)*.04||1;
  return L.tPad+(mx+pad-p)/((mx-mn+pad*2))*L.cH;
}
function yToP(y,mn,mx,L){
  const pad=(mx-mn)*.04||1;
  return mx+pad-(y-L.tPad)/L.cH*(mx-mn+pad*2);
}
function xToIdx(x,L){
  const n=S.viewEnd-S.viewStart;
  return Math.round(S.viewStart+(x-L.lPad)/L.cW*n);
}

// Get visible price range (manual override or auto from data)
function getVisiblePriceRange(view){
  if(S.priceMin!==null&&S.priceMax!==null)
    return{minP:S.priceMin,maxP:S.priceMax};
  const hs=view.map(b=>b.h).filter(Boolean);
  const ls=view.map(b=>b.l).filter(Boolean);
  if(!hs.length)return{minP:0,maxP:1};
  return{minP:Math.min(...ls),maxP:Math.max(...hs)};
}

// Update the price panel on the right
function updatePricePanel(d,view,vs,ve){
  if(!d.length)return;
  const last=d[d.length-1];
  const first=d[0];
  const chg=last.c-first.c,pct=chg/first.c*100;
  const cls=chg>0?'up':chg<0?'dn':'flat',sg=chg>0?'+':'';
  const setEl=(id,v,c)=>{const el=document.getElementById(id);if(el){el.textContent=v;if(c)el.className='pp-val '+c}};
  setEl('pp-last',fmt(last.c),cls);
  setEl('pp-open',fmt(first.o));
  setEl('pp-high',fmt(Math.max(...d.map(b=>b.h).filter(Boolean))),'pp-high');
  setEl('pp-low',fmt(Math.min(...d.map(b=>b.l).filter(Boolean))),'pp-low');
  setEl('pp-chg',`${sg}${pct.toFixed(2)}%`,cls);
  setEl('pp-vol',fmtV(last.v));
  setEl('pp-bars',d.length+'');
  const iKey=S.intervalKey;
  setEl('pp-intv',iKey);
  // Compute MA/RSI/ATR for last visible bar
  const lv=ve-1;
  const ma20=calcMA(d,20);const ma50=calcMA(d,50);
  const rsi=calcRSI_sig(d,14);const atr=calcATR(d,14);
  if(ma20[lv])setEl('pp-ma20',fmt(ma20[lv]));
  if(ma50[lv])setEl('pp-ma50',fmt(ma50[lv]));
  if(rsi[lv])setEl('pp-rsi',rsi[lv].toFixed(1));
  if(atr[lv])setEl('pp-atr',fmt(atr[lv]));
}

// Panel resize handle (3 horizontal dots)
function drawPanelHandle(ctx,L,y,panelKey){
  const cx=L.W-L.rPad-50;
  const isHovered=S._hoverPanel===panelKey;
  ctx.fillStyle=isHovered?'rgba(255,255,255,0.35)':'rgba(255,255,255,0.12)';
  for(let k=-1;k<=1;k++){
    ctx.beginPath();ctx.arc(cx+k*5,y,2,0,Math.PI*2);ctx.fill();
  }
  // Hover area indicator
  if(isHovered){
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(L.lPad,y);ctx.lineTo(L.W-L.rPad,y);ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ─── MAIN DRAW ───────────────────────────────────────────────
function draw(){
  const d=S.filteredData.length?S.filteredData:S.data;
  if(!d.length)return;
  const L=getLayout();
  const vs=clamp(Math.floor(S.viewStart),0,d.length-1);
  const ve=clamp(Math.ceil(S.viewEnd),1,d.length);
  const view=d.slice(vs,ve);
  if(!view.length)return;

  const{minP,maxP}=getVisiblePriceRange(view);
  const maxV=Math.max(...view.map(x=>x.v||0));
  const pY=p=>pToY(p,minP,maxP,L);
  const barW=L.cW/Math.max(view.length,1);
  const cw=Math.max(1,barW*.75);

  updatePricePanel(d,view,vs,ve);

  // Clear
  ctx.clearRect(0,0,L.W,L.H);
  ctx.fillStyle='#0d0d0f';
  ctx.fillRect(0,0,L.W,L.H);

  // ─ Grid & labels ─
  const gridN=7;
  for(let g=0;g<=gridN;g++){
    const y=L.tPad+L.cH*g/gridN;
    const priceAtLine=yToP(y,minP,maxP,L);
    ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(L.lPad,y);ctx.lineTo(L.W-L.rPad,y);ctx.stroke();
    // Price axis background band
    ctx.fillStyle='rgba(26,26,36,0.85)';
    ctx.fillRect(L.W-L.rPad,y-7,L.rPad-1,13);
    // Tick mark
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(L.W-L.rPad,y);ctx.lineTo(L.W-L.rPad+4,y);ctx.stroke();
    // Price label
    ctx.fillStyle='#6a6a8a';ctx.font='10px Segoe UI';ctx.textAlign='left';
    ctx.fillText(fmt(priceAtLine),L.W-L.rPad+6,y+3);
  }
  // Price axis border line
  ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(L.W-L.rPad,L.tPad);ctx.lineTo(L.W-L.rPad,L.tPad+L.cH);ctx.stroke();
  const tickEvery=Math.max(1,Math.floor(view.length/9));
  view.forEach((_,vi)=>{
    if(vi%tickEvery!==0)return;
    const x=dToX(vs+vi,L);
    ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(x,L.tPad);ctx.lineTo(x,L.tPad+L.cH);ctx.stroke();
    const bar=d[vs+vi];
    const intradayIntervals=['1m','2m','5m','15m','30m','45m','60m','90m','2h_agg','4h_agg'];
    const isIntraday=intradayIntervals.includes(S.intervalKey);
    const lbl=isIntraday
      ?bar.t.toLocaleTimeString('id-ID',{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'})
      :bar.t.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'2-digit'});
    ctx.fillStyle='#44445a';ctx.font='10px Segoe UI';ctx.textAlign='center';
    ctx.fillText(lbl,x,L.tPad+L.cH+14);
  });

  // ─ Fair Value Gap ─
  if(IC.fvg.vis){
    const fvgs=calcFVG(d);
    fvgs.forEach(g=>{
      if(g.i2<vs||g.i0>=ve)return;
      const x1=dToX(Math.max(g.i0,vs),L);
      const x2=dToX(Math.min(g.i2,ve-1),L)+cw/2;
      const y1=pY(g.top),y2=pY(g.bottom);
      ctx.fillStyle=g.type==='bull'?IC.fvg.bullColor:IC.fvg.bearColor;
      ctx.fillRect(x1-cw/2,y1,x2-x1+cw/2,y2-y1);
      if(IC.fvg.border){
        ctx.strokeStyle=g.type==='bull'?'rgba(38,166,154,0.4)':'rgba(239,83,80,0.4)';
        ctx.lineWidth=.7;ctx.setLineDash([]);
        ctx.strokeRect(x1-cw/2,y1,x2-x1+cw/2,y2-y1);
      }
      // Label
      ctx.fillStyle=g.type==='bull'?'rgba(38,166,154,0.7)':'rgba(239,83,80,0.7)';
      ctx.font='bold 8px Segoe UI';ctx.textAlign='center';
      ctx.fillText('FVG',x1+(x2-x1)/2,(y1+y2)/2+3);
    });
  }

  // ─ Order Block (SMC) ─
  if(IC.ob.vis){
    const obs=calcOB(d);
    obs.forEach(ob=>{
      // Draw OB from its formation bar extending to right edge of chart
      const x0=dToX(ob.i,L);
      const xEnd=dToX(Math.min(d.length-1,ve),L)+cw/2;
      if(xEnd<L.lPad||x0>L.W-L.rPad)return;
      const xL=Math.max(L.lPad,x0-cw/2);
      const xR=Math.min(L.W-L.rPad,xEnd);
      const bw=xR-xL; if(bw<=0)return;

      const isBull=ob.type==='bull';
      const clrFill=isBull?IC.ob.bullColor:IC.ob.bearColor;
      const clrBorder=isBull?'rgba(38,166,154,0.7)':'rgba(239,83,80,0.7)';
      const clrBody=isBull?'rgba(38,166,154,0.25)':'rgba(239,83,80,0.25)';

      // Full candle range (wick zone) - lighter fill
      const yTop=pY(ob.top), yBot=pY(ob.bottom);
      if(yBot>yTop&&yBot-yTop>0){
        ctx.fillStyle=clrFill;ctx.globalAlpha=0.08;
        ctx.fillRect(xL,yTop,bw,yBot-yTop);
        ctx.globalAlpha=1;
      }

      // Body zone — stronger fill (the actual OB)
      const yBT=pY(ob.bodyTop), yBB=pY(ob.bodyBot);
      if(yBB>yBT&&yBB-yBT>0){
        ctx.fillStyle=clrBody;ctx.globalAlpha=1;
        ctx.fillRect(xL,yBT,bw,yBB-yBT);
        // Border on body
        ctx.strokeStyle=clrBorder;ctx.lineWidth=1;ctx.setLineDash([]);
        ctx.strokeRect(xL,yBT,bw,yBB-yBT);
      }

      // Equilibrium (50%) line
      const yEQ=pY(ob.eq);
      if(yEQ>=L.tPad&&yEQ<=L.tPad+L.cH){
        ctx.strokeStyle=clrBorder;ctx.lineWidth=0.7;ctx.setLineDash([4,3]);
        ctx.beginPath();ctx.moveTo(xL,yEQ);ctx.lineTo(xR,yEQ);ctx.stroke();
        ctx.setLineDash([]);
      }

      // Partial mitigation overlay
      if(ob.partialMit){
        ctx.fillStyle=isBull?'rgba(239,83,80,0.06)':'rgba(38,166,154,0.06)';
        ctx.fillRect(xL,yBT,bw,yBB-yBT);
      }

      // Label
      const labelY=Math.max(L.tPad+10,Math.min(yBT+9,L.tPad+L.cH-4));
      ctx.fillStyle=clrBorder;ctx.font='bold 8px Segoe UI';ctx.textAlign='left';
      ctx.fillText(isBull?'OB↑':'OB↓',xL+2,labelY);
      // BOS price label
      ctx.font='7px Segoe UI';ctx.globalAlpha=0.6;
      ctx.fillText(fmt(ob.eq),xL+2,labelY+9);
      ctx.globalAlpha=1;
    });
  }

  // ─ Bollinger Bands ─
  if(IC.bb.vis){
    const bb=calcBB(d,+IC.bb.period,+IC.bb.mult);
    if(IC.bb.fill){
      ctx.beginPath();
      view.forEach((_,vi)=>{const i=vs+vi;if(bb[i]?.u!=null){const x=dToX(i,L);vi===0?ctx.moveTo(x,pY(bb[i].u)):ctx.lineTo(x,pY(bb[i].u))}});
      for(let vi=view.length-1;vi>=0;vi--){const i=vs+vi;if(bb[i]?.l!=null){ctx.lineTo(dToX(i,L),pY(bb[i].l))}}
      ctx.closePath();ctx.fillStyle='rgba(167,139,250,0.04)';ctx.fill();
    }
    [['u','rgba(167,139,250,0.5)',[4,3]],['mid','rgba(167,139,250,0.25)',[]],['l','rgba(167,139,250,0.5)',[4,3]]].forEach(([k,c,dash])=>{
      ctx.beginPath();ctx.strokeStyle=c;ctx.lineWidth=IC.bb.width;ctx.setLineDash(dash);
      view.forEach((_,vi)=>{const i=vs+vi;if(bb[i]?.[k]!=null){const x=dToX(i,L),y=pY(bb[i][k]);vi===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}});
      ctx.stroke();ctx.setLineDash([]);
    });
  }

  // ─ MA ─
  if(IC.ma.vis){
    [[+IC.ma.p1,IC.ma.c1],[+IC.ma.p2,IC.ma.c2]].forEach(([p,c])=>{
      const ma=calcMA(d,p);
      ctx.beginPath();ctx.strokeStyle=c;ctx.lineWidth=+IC.ma.width;ctx.setLineDash([]);
      view.forEach((_,vi)=>{const i=vs+vi;if(ma[i]!=null){const x=dToX(i,L),y=pY(ma[i]);vi===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}});
      ctx.stroke();
    });
  }

  // ─ EMA ─
  if(IC.ema.vis){
    [[+IC.ema.p1,IC.ema.c1],[+IC.ema.p2,IC.ema.c2]].forEach(([p,c])=>{
      const ema=calcEMA(d,p);
      ctx.beginPath();ctx.strokeStyle=c;ctx.lineWidth=+IC.ema.width;ctx.setLineDash([5,3]);
      view.forEach((_,vi)=>{const i=vs+vi;if(ema[i]!=null){const x=dToX(i,L),y=pY(ema[i]);vi===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}});
      ctx.stroke();ctx.setLineDash([]);
    });
  }

  // ─ S&R ─
  if(IC.sr.vis){
    const levels=calcSR(d);
    const lastP=d[d.length-1]?.c||0;
    levels.forEach(lv=>{
      if(lv.price<minP||lv.price>maxP)return;
      const y=pY(lv.price),isR=lv.price>lastP;
      ctx.strokeStyle=isR?IC.sr.resColor:IC.sr.supColor;
      ctx.lineWidth=1;ctx.setLineDash([6,4]);
      ctx.globalAlpha=.55;
      ctx.beginPath();ctx.moveTo(L.lPad,y);ctx.lineTo(L.W-L.rPad,y);ctx.stroke();
      ctx.globalAlpha=1;ctx.setLineDash([]);
      ctx.fillStyle=isR?IC.sr.resColor:IC.sr.supColor;
      ctx.font='bold 9px Segoe UI';ctx.textAlign='right';
      ctx.fillText((isR?'R':'S')+' '+fmt(lv.price),L.W-L.rPad-2,y-2);
    });
  }

  // ─ Supertrend ─
  if(IC.supertrend.vis){
    const stData=calcSupertrend(d,+IC.supertrend.atrPeriod||10,+IC.supertrend.multiplier||3);
    let prevTrend=null;
    view.forEach((_,vi)=>{
      const i=vs+vi;
      if(stData.trend[i]==null)return;
      const clr=stData.trend[i]===1?IC.supertrend.upColor:IC.supertrend.dnColor;
      const stVal=stData.trend[i]===1?stData.up[i]:stData.dn[i];
      if(stVal==null)return;
      const x=dToX(i,L),y=pY(stVal);
      if(vi===0||prevTrend!==stData.trend[i]){
        if(vi>0)ctx.stroke();
        ctx.beginPath();ctx.strokeStyle=clr;ctx.lineWidth=+IC.supertrend.width||2;ctx.setLineDash([]);
        ctx.moveTo(x,y);
      } else ctx.lineTo(x,y);
      prevTrend=stData.trend[i];
      if(vi===view.length-1)ctx.stroke();
    });
  }

  // ─ Ichimoku Cloud ─
  if(IC.ichimoku.vis){
    const ichi=calcIchimoku(d,+IC.ichimoku.tenkanPeriod,+IC.ichimoku.kijunPeriod,+IC.ichimoku.senkouBPeriod);
    // Cloud fill
    ctx.save();
    for(let vi=1;vi<view.length;vi++){
      const i=vs+vi;
      if(!ichi.senkouA[i]||!ichi.senkouB[i])continue;
      const x1=dToX(i-1,L),x2=dToX(i,L);
      const a1=ichi.senkouA[i-1],a2=ichi.senkouA[i];
      const b1=ichi.senkouB[i-1],b2=ichi.senkouB[i];
      if(!a1||!b1)continue;
      const isBull=a1>b1;
      ctx.beginPath();ctx.moveTo(x1,pY(a1));ctx.lineTo(x2,pY(a2));ctx.lineTo(x2,pY(b2));ctx.lineTo(x1,pY(b1));ctx.closePath();
      ctx.fillStyle=isBull?IC.ichimoku.bullColor:IC.ichimoku.bearColor;ctx.fill();
    }
    // Tenkan & Kijun lines
    [[ichi.tenkan,IC.ichimoku.tenkanColor,'Tenkan'],[ichi.kijun,IC.ichimoku.kijunColor,'Kijun']].forEach(([arr,clr])=>{
      ctx.beginPath();ctx.strokeStyle=clr;ctx.lineWidth=1.5;ctx.setLineDash([]);
      view.forEach((_,vi)=>{const i=vs+vi;if(arr[i]!=null){const x=dToX(i,L),y=pY(arr[i]);vi===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}});
      ctx.stroke();
    });
    ctx.restore();
  }

  // ─ User Drawings (behind candles) ─
  drawUserShapes(view,vs,ve,minP,maxP,L);

  // ─ Candles ─
  if(IC.candle.vis){
    view.forEach((bar,vi)=>{
      if(!bar.h||!bar.l)return;
      const i=vs+vi,x=dToX(i,L),isUp=bar.c>=bar.o;
      const clr=isUp?IC.candle.upColor:IC.candle.dnColor;
      ctx.strokeStyle=clr;ctx.lineWidth=+IC.candle.wickWidth;ctx.setLineDash([]);
      ctx.beginPath();ctx.moveTo(x,pY(bar.h));ctx.lineTo(x,pY(Math.max(bar.o,bar.c)));ctx.stroke();
      ctx.beginPath();ctx.moveTo(x,pY(Math.min(bar.o,bar.c)));ctx.lineTo(x,pY(bar.l));ctx.stroke();
      const yT=pY(Math.max(bar.o,bar.c)),yB=pY(Math.min(bar.o,bar.c)),bH=Math.max(1,yB-yT);
      ctx.fillStyle=isUp?IC.candle.upColor:IC.candle.dnColor;
      ctx.globalAlpha=.85;ctx.fillRect(x-cw/2,yT,cw,bH);ctx.globalAlpha=1;
      if(bH>2){ctx.strokeStyle=clr;ctx.lineWidth=.5;ctx.strokeRect(x-cw/2,yT,cw,bH)}
    });
  } else {
    ctx.beginPath();ctx.strokeStyle='#4f8ef7';ctx.lineWidth=2;ctx.setLineDash([]);
    view.forEach((bar,vi)=>{if(!bar.c)return;const x=dToX(vs+vi,L),y=pY(bar.c);vi===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
    ctx.stroke();
  }

  // ─ Swing High/Low ─
  if(IC.swingHL.vis){
    const swing=calcSwingHL(d,+IC.swingHL.lookback||5);
    // Highs
    swing.highs.forEach(s=>{
      if(s.i<vs||s.i>=ve)return;
      const x=dToX(s.i,L),y=pY(s.price)-10;
      ctx.fillStyle=IC.swingHL.highColor;ctx.font=`bold ${+IC.swingHL.labelSize||9}px Segoe UI`;ctx.textAlign='center';
      ctx.fillText('H',x,y);
      ctx.beginPath();ctx.moveTo(x-3,y+2);ctx.lineTo(x,y-3);ctx.lineTo(x+3,y+2);
      ctx.fillStyle=IC.swingHL.highColor;ctx.fill();
    });
    // Lows
    swing.lows.forEach(s=>{
      if(s.i<vs||s.i>=ve)return;
      const x=dToX(s.i,L),y=pY(s.price)+14;
      ctx.fillStyle=IC.swingHL.lowColor;ctx.font=`bold ${+IC.swingHL.labelSize||9}px Segoe UI`;ctx.textAlign='center';
      ctx.fillText('L',x,y+9);
      ctx.beginPath();ctx.moveTo(x-3,y-2);ctx.lineTo(x,y+3);ctx.lineTo(x+3,y-2);
      ctx.fillStyle=IC.swingHL.lowColor;ctx.fill();
    });
  }

  // ─ Volume Delta ─
  if(IC.volDelta.vis){
    const vd=calcVolDelta(d);
    const maxDelta=Math.max(...vd.map(v=>Math.abs(v.delta)))||1;
    const PY3=panelY(L);
    const vdY=PY3.vdelta;
    const vdH=Math.max(20,L.vdeltH);
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(L.lPad,vdY);ctx.lineTo(L.W-L.rPad,vdY);ctx.stroke();
    drawPanelHandle(ctx,L,vdY,'vdelta');
    view.forEach((_,vi)=>{
      const i=vs+vi,x=dToX(i,L);
      if(!vd[i])return;
      const isPos=vd[i].delta>=0;
      const bh=Math.max(1,Math.abs(vd[i].delta)/maxDelta*(vdH-4));
      ctx.fillStyle=isPos?IC.volDelta.bullColor:IC.volDelta.bearColor;
      ctx.fillRect(x-cw/2,vdY+(isPos?vdH/2-bh:vdH/2),cw,bh);
    });
    // Zero line
    ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(L.lPad,vdY+vdH/2);ctx.lineTo(L.W-L.rPad,vdY+vdH/2);ctx.stroke();
    ctx.fillStyle='#44445a';ctx.font='8px Segoe UI';ctx.textAlign='left';
    ctx.fillText('ΔVol',L.lPad+2,vdY+9);
  }

  // ─ Market Order Bubbles ─
  if(IC.orderBubbles.vis){
    const avgV=d.slice(Math.max(0,vs-20),ve).reduce((a,b)=>a+(b.v||0),0)/Math.max(1,(ve-vs+20));
    view.forEach((bar,vi)=>{
      if(!bar.v||bar.v<avgV*+IC.orderBubbles.threshold)return;
      const i=vs+vi,x=dToX(i,L);
      const ratio=Math.min(bar.v/avgV/+IC.orderBubbles.threshold,4);
      const r=clamp(ratio*6,4,+IC.orderBubbles.maxSize||24);
      const isBull=bar.c>=bar.o;
      const clr=isBull?IC.orderBubbles.buyColor:IC.orderBubbles.sellColor;
      const y=isBull?pY(bar.l)+r+4:pY(bar.h)-r-4;
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=clr;ctx.fill();
      ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(7,r*.6)}px Segoe UI`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(isBull?'B':'S',x,y);ctx.textBaseline='alphabetic';
    });
  }

  // ─ Footprint Chart ─
  if(IC.footprint.vis&&cw>20){
    const vd2=calcVolDelta(d);
    view.forEach((bar,vi)=>{
      const i=vs+vi,x=dToX(i,L);
      if(!vd2[i])return;
      const {buy,sell}=vd2[i];
      const yT=pY(Math.max(bar.o,bar.c)),yB=pY(Math.min(bar.o,bar.c));
      const bh=Math.max(4,yB-yT);
      // Split candle body into buy (right half) and sell (left half)
      const halfW=cw/2;
      ctx.fillStyle=IC.footprint.bullColor;ctx.fillRect(x,yT,halfW,bh);
      ctx.fillStyle=IC.footprint.bearColor;ctx.fillRect(x-halfW,yT,halfW,bh);
      // Labels
      if(cw>30){
        ctx.font='6px Segoe UI';ctx.textAlign='right';
        ctx.fillStyle=IC.footprint.textColor;
        ctx.fillText(fmtV(Math.round(sell)),x-1,yT+bh/2+2);
        ctx.textAlign='left';
        ctx.fillText(fmtV(Math.round(buy)),x+1,yT+bh/2+2);
      }
    });
  }

  // ─ High Volume Node (HVN) ─
  if(IC.hvn.vis){
    const vp=calcVP(d,+IC.hvn.bins||40);
    const maxVol=Math.max(...vp.map(b=>b.vol))||1;
    const p85=maxVol*0.7; // top 30% by volume = high volume nodes
    vp.forEach(b=>{
      if(b.vol<p85)return;
      const y1=pY(b.pH),y2=pY(b.pL);
      if(y2<L.tPad||y1>L.tPad+L.cH)return;
      const bH=Math.max(1,y2-y1);
      const opacity=0.15+(b.vol/maxVol)*0.5;
      ctx.fillStyle=IC.hvn.color;ctx.globalAlpha=opacity;
      ctx.fillRect(L.lPad,y1,L.cW,bH);
      ctx.globalAlpha=1;
    });
    // POC line
    const poc=vp.reduce((a,b)=>b.vol>a.vol?b:a);
    const pocY=(pY(poc.pH)+pY(poc.pL))/2;
    ctx.strokeStyle=IC.hvn.pocColor;ctx.lineWidth=+IC.hvn.width||3;
