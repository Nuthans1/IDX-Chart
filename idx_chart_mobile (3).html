    ctx.beginPath();ctx.moveTo(L.lPad,pocY);ctx.lineTo(L.W-L.rPad,pocY);ctx.stroke();
    ctx.fillStyle=IC.hvn.pocColor;ctx.font='bold 9px Segoe UI';ctx.textAlign='right';
    ctx.fillText('HVN POC '+fmt(poc.pL),L.W-L.rPad-2,pocY-2);
  }

  // ─ Stochastic Panel ─
  if(IC.stochPanel?.vis){
    const st2=calcStoch(d,+IC.stochPanel.kPeriod||14,+IC.stochPanel.dPeriod||3);
    const PY4=panelY(L);
    const stY0=PY4.stoch;
    const stH=Math.max(20,L.stochH);
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(L.lPad,stY0);ctx.lineTo(L.W-L.rPad,stY0);ctx.stroke();
    drawPanelHandle(ctx,L,stY0,'stoch');
    // OB/OS zones
    ctx.fillStyle='rgba(239,83,80,0.06)';
    ctx.fillRect(L.lPad,stY0,L.cW,(+IC.stochPanel.obLevel||80)/100*stH);
    ctx.fillStyle='rgba(38,166,154,0.06)';
    const osY=(+IC.stochPanel.obLevel||80)/100*stH;
    ctx.fillRect(L.lPad,stY0+osY,L.cW,stH-osY);
    // OB/OS lines
    [IC.stochPanel.obLevel,IC.stochPanel.osLevel].forEach((lvl,ii)=>{
      const y2=stY0+stH*(1-lvl/100);
      ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(L.lPad,y2);ctx.lineTo(L.W-L.rPad,y2);ctx.stroke();
      ctx.setLineDash([]);
    });
    // %K and %D lines
    [[st2.k,IC.stochPanel.kColor,'%K'],[st2.d,IC.stochPanel.dColor,'%D']].forEach(([arr,clr,lbl])=>{
      ctx.beginPath();ctx.strokeStyle=clr;ctx.lineWidth=1.2;ctx.setLineDash([]);
      view.forEach((_,vi)=>{
        const i=vs+vi;if(arr[i]==null)return;
        const x=dToX(i,L),y=stY0+stH*(1-arr[i]/100);
        vi===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      });
      ctx.stroke();
    });
    ctx.fillStyle='#44445a';ctx.font='8px Segoe UI';ctx.textAlign='left';
    ctx.fillText(`Stoch(${IC.stochPanel.kPeriod},${IC.stochPanel.dPeriod})`,L.lPad+2,stY0+9);
  }

  // ─ Pattern markers ─
  if(IC.pat.vis){
    const pats=detectPatterns(d);
    pats.forEach(p=>{
      if(p.i<vs||p.i>=ve)return;
      const bar=d[p.i],x=dToX(p.i,L);
      const isBull=p.bull===true,isBear=p.bull===false;
      const y=isBear?pY(bar.h)-12:pY(bar.l)+12;
      ctx.fillStyle=p.c;
      ctx.beginPath();
      if(isBull){ctx.moveTo(x,y+5);ctx.lineTo(x-4,y-1);ctx.lineTo(x+4,y-1)}
      else if(isBear){ctx.moveTo(x,y-5);ctx.lineTo(x-4,y+1);ctx.lineTo(x+4,y+1)}
      else{ctx.arc(x,y,3,0,Math.PI*2)}
      ctx.fill();
      if(cw>8){ctx.fillStyle=p.c;ctx.font='bold 7px Segoe UI';ctx.textAlign='center';ctx.fillText(p.name,x,isBear?y-8:y+12)}
    });
  }

  // ─ Buy/Sell Signals ─
  if(IC.sig.vis){
    // Always compute signals on FULL data for indicator warmup,
    // but only render signals whose bar index falls in the filtered view
    const fullD=S.data.length?S.data:d;
    const sigs=calcSignals(fullD);
    // Map full-data indices back to filteredData indices
    // filteredData is a slice of data, so find offset
    const offset=fullD.length-d.length;
    sigs.forEach(sig=>{
      // Translate full-data index to filtered-data index
      const fi=sig.i-offset;
      if(fi<vs||fi>=ve||fi<0)return;
      const bar=d[fi],x=dToX(fi,L);
      const isBuy=sig.type==='BUY';
      const clr=isBuy?IC.sig.buyColor:IC.sig.sellColor;
      const str=sig.strength; // 1-5

      // Vertical offset (avoid stacking on patterns)
      const yBase=isBuy?pY(bar.l):pY(bar.h);
      const yOff=isBuy?28+str*2:-(28+str*2);
      const lx=x, ly=yBase+yOff;

      // Connector line from label to candle
      ctx.strokeStyle=clr;ctx.lineWidth=.8;ctx.globalAlpha=.5;ctx.setLineDash([2,3]);
      ctx.beginPath();ctx.moveTo(lx,yBase+(isBuy?4:-4));ctx.lineTo(lx,ly+(isBuy?-10:10));ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;

      // Dot indicator
      if(IC.sig.showDot){
        ctx.fillStyle=clr;ctx.beginPath();
        ctx.arc(lx,yBase+(isBuy?4:-4),3+str*.5,0,Math.PI*2);ctx.fill();
      }

      // Label pill with regime + ADX tooltip
      if(IC.sig.showLabel){
        const lbl=isBuy?'BUY':'SELL';
        const stars='★'.repeat(str)+'☆'.repeat(5-str);
        const regime=sig.regime||'';
        ctx.font=`bold ${10+str*.4}px Segoe UI`;
        const tw=ctx.measureText(lbl).width;
        const pw=tw+16,ph=17;
        const px2=lx-pw/2,py2=ly-ph/2;

        // Pill with glow
        ctx.shadowColor=clr;ctx.shadowBlur=str>=3?5:2;
        ctx.fillStyle=clr;ctx.globalAlpha=.9;
        roundRect(ctx,px2,py2,pw,ph,4);ctx.fill();
        ctx.shadowBlur=0;ctx.globalAlpha=1;

        // Label
        ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(lbl,lx,ly);ctx.textBaseline='alphabetic';

        // Stars + regime tag
        ctx.font='7px Segoe UI';ctx.globalAlpha=.7;ctx.fillStyle=clr;
        const tag=(str>=3?stars+' ':'')+regime;
        if(tag)ctx.fillText(tag,lx,isBuy?ly+14:ly-8);
        ctx.globalAlpha=1;

        // Hover tooltip: reasons + ADX + regime
        const{x:mx,y:my}=S.mouse;
        if(Math.abs(mx-lx)<pw/2+6&&Math.abs(my-ly)<ph/2+6){
          const adxStr=sig.adx?` | ADX:${sig.adx}`:'';
          const tip=sig.reasons.join(' · ')+adxStr;
          ctx.font='10px Segoe UI';
          const tipW=Math.min(ctx.measureText(tip).width+16,320);
          const tipX=clamp(lx-tipW/2,4,L.W-L.rPad-tipW-4);
          const tipY=isBuy?py2-24:py2+ph+4;
          ctx.fillStyle='#0d0d18';ctx.globalAlpha=.96;
          roundRect(ctx,tipX,tipY,tipW,20,4);ctx.fill();ctx.globalAlpha=1;
          ctx.strokeStyle=clr;ctx.lineWidth=1;
          roundRect(ctx,tipX,tipY,tipW,20,4);ctx.stroke();
          ctx.fillStyle=clr;ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText(tip,tipX+tipW/2,tipY+10,tipW-8);
          ctx.textBaseline='alphabetic';
        }
      }
    });
  }

  // ─ Volume Bars ─
  if(IC.vol.vis&&maxV>0){
    const PY=panelY(L);
    const volY=PY.vol;
    const vH=L.volH;
    // Panel separator line + resize handle
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(L.lPad,volY);ctx.lineTo(L.W-L.rPad,volY);ctx.stroke();
    // Resize handle (3 dots in center)
    drawPanelHandle(ctx,L,volY,'vol');
    // Bars
    view.forEach((bar,vi)=>{
      if(!bar.v)return;
      const x=dToX(vs+vi,L),isUp=bar.c>=bar.o;
      const bh=Math.max(2,(bar.v/maxV)*(vH-8));
      ctx.fillStyle=isUp?IC.vol.upColor:IC.vol.dnColor;
      ctx.globalAlpha=+IC.vol.opacity;
      ctx.fillRect(x-cw/2,volY+vH-6-bh,cw,bh);
      ctx.globalAlpha=1;
    });
    // Label
    ctx.fillStyle='#44445a';ctx.font='8px Segoe UI';ctx.textAlign='left';
    ctx.fillText('Volume',L.lPad+2,volY+9);
  }

  // ─ MACD Panel ─
  if(IC.macdPanel?.vis){
    const{macd:ml,signal:sl2,hist:hl2}=calcMACD(d,+IC.macdPanel.fast,+IC.macdPanel.slow,+IC.macdPanel.signal);
    const PY2=panelY(L);
    const macdY0=PY2.macd;
    const macdH=Math.max(20,L.macdH);
    // Panel border + resize handle
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(L.lPad,macdY0);ctx.lineTo(L.W-L.rPad,macdY0);ctx.stroke();
    drawPanelHandle(ctx,L,macdY0,'macd');
    const allHist=hl2.filter(x=>x!=null);
    const maxH=Math.max(...allHist.map(Math.abs))||1;
    const mY=v=>macdY0+macdH/2-(v/maxH)*(macdH/2-2);
    // Zero line
    ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(L.lPad,macdY0+macdH/2);ctx.lineTo(L.W-L.rPad,macdY0+macdH/2);ctx.stroke();
    // Histogram
    view.forEach((_,vi)=>{
      const i=vs+vi;if(hl2[i]==null)return;
      const x=dToX(i,L),bh=Math.abs(hl2[i]/maxH)*(macdH/2-2);
      ctx.fillStyle=hl2[i]>=0?IC.macdPanel.bullHistColor:IC.macdPanel.bearHistColor;
      ctx.globalAlpha=.6;
      ctx.fillRect(x-cw/2,hl2[i]>=0?mY(hl2[i]):macdY0+macdH/2,cw,bh);
      ctx.globalAlpha=1;
    });
    // MACD & Signal lines
    [[ml,IC.macdPanel.macdColor],[sl2,IC.macdPanel.signalColor]].forEach(([arr,clr])=>{
      ctx.beginPath();ctx.strokeStyle=clr;ctx.lineWidth=1.2;ctx.setLineDash([]);
      view.forEach((_,vi)=>{const i=vs+vi;if(arr[i]!=null){const x=dToX(i,L),y=mY(arr[i]);vi===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}});
      ctx.stroke();
    });
    ctx.fillStyle='#44445a';ctx.font='9px Segoe UI';ctx.textAlign='left';
    ctx.fillText('MACD',L.lPad+2,macdY0+10);
  }

  // ─ AMFD Cycle Indicator ─
  if(IC.amfd?.vis){
    const cfg  = IC.amfd;
    const fullD = S.data.length ? S.data : d;
    const cycles = calcAMFD(fullD);
    const offset = Math.max(0, fullD.length - d.length);

    cycles.forEach(cyc=>{
      // Translate indices to filtered view
      const aS  = cyc.accumStart  - offset;
      const aE  = cyc.accumEnd    - offset;
      const mI  = cyc.manipIdx    - offset;
      const dS  = cyc.distStart   - offset;
      const dE  = cyc.distEnd     - offset;

      const bull = cyc.manipDir === 1;

      // ── ACCUMULATION ZONE ──
      if(aS < ve && aE >= vs){
        const x1 = dToX(Math.max(aS, vs), L);
        const x2 = dToX(Math.min(aE, ve-1), L) + cw/2;
        const y1 = pY(cyc.rangeH + cyc.avgATR*0.1);
        const y2 = pY(cyc.rangeL - cyc.avgATR*0.1);
        // Fill
        ctx.fillStyle = cfg.accumColor;
        ctx.fillRect(x1, y1, x2-x1, y2-y1);
        // Border (dashed)
        ctx.strokeStyle = cfg.accumBorder;
        ctx.lineWidth = 1; ctx.setLineDash([4,3]);
        ctx.strokeRect(x1, y1, x2-x1, y2-y1);
        ctx.setLineDash([]);
        // Range lines (high/low of accum zone)
        [cyc.rangeH, cyc.rangeL].forEach(price=>{
          const yLine = pY(price);
          ctx.strokeStyle = cfg.accumBorder;
          ctx.lineWidth = 0.7; ctx.setLineDash([2,4]);
          ctx.beginPath();
          ctx.moveTo(x1, yLine); ctx.lineTo(Math.min(x2, L.W-L.rPad), yLine);
          ctx.stroke(); ctx.setLineDash([]);
        });
        // Label
        if(cfg.showLabels && x2-x1 > 20){
          ctx.fillStyle = cfg.accumBorder;
          ctx.font = 'bold 8px Segoe UI'; ctx.textAlign = 'center';
          ctx.fillText('ACCUM', (x1+x2)/2, y1+10);
        }
      }

      // ── MANIPULATION (stop hunt candle) ──
      if(mI >= vs && mI < ve){
        const xM = dToX(mI, L);
        const bar = d[mI];
        if(bar){
          // Highlight the manipulation candle body + extended wick
          const yHigh = pY(bar.h + cyc.avgATR*0.15);
          const yLow  = pY(bar.l - cyc.avgATR*0.15);
          const wHalf = Math.max(cw*0.6, 4);
          // Outer halo
          ctx.fillStyle = cfg.manipColor;
          ctx.fillRect(xM - wHalf, yHigh, wHalf*2, yLow - yHigh);
          ctx.strokeStyle = cfg.manipBorder;
          ctx.lineWidth = 1.5; ctx.setLineDash([]);
          ctx.strokeRect(xM - wHalf, yHigh, wHalf*2, yLow - yHigh);
          // Label above/below
          if(cfg.showLabels){
            ctx.fillStyle = cfg.manipBorder;
            ctx.font = 'bold 8px Segoe UI'; ctx.textAlign = 'center';
            const lY = bull ? yLow + 12 : yHigh - 4;
            ctx.fillText('MANIP', xM, lY);
          }
          // Arrow showing the trap direction
          ctx.strokeStyle = cfg.manipBorder;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          if(bull){
            // Fake down spike → arrow points down then up
            ctx.moveTo(xM, pY(bar.l));
            ctx.lineTo(xM, pY(bar.l) + 14);
          } else {
            ctx.moveTo(xM, pY(bar.h));
            ctx.lineTo(xM, pY(bar.h) - 14);
          }
          ctx.stroke();
        }
      }

      // ── FVG (imbalance after manipulation) ──
      if(cfg.showFVG && cyc.fvg){
        const fvg = cyc.fvg;
        const fi0 = fvg.i0 - offset;
        const fi2 = fvg.i2 - offset;
        if(fi2 >= vs && fi0 < ve){
          const xF1 = dToX(Math.max(fi0, vs), L);
          const xF2 = dToX(Math.min(fi2, ve-1), L) + cw*2; // extend right to show zone
          const xFEnd = Math.min(xF2, dToX(dE>=0?Math.min(dE,ve-1):ve-1,L));
          const yFT = pY(fvg.top);
          const yFB = pY(fvg.bottom);
          if(yFB > yFT){
            ctx.fillStyle = cfg.fvgColor;
            ctx.fillRect(xF1, yFT, Math.max(xFEnd-xF1, 8), yFB-yFT);
            ctx.strokeStyle = cfg.fvgBorder;
            ctx.lineWidth = 1; ctx.setLineDash([3,2]);
            ctx.strokeRect(xF1, yFT, Math.max(xFEnd-xF1, 8), yFB-yFT);
            ctx.setLineDash([]);
            if(cfg.showLabels){
              ctx.fillStyle = cfg.fvgBorder;
              ctx.font = 'bold 8px Segoe UI'; ctx.textAlign = 'left';
              ctx.fillText('FVG', xF1+2, yFT+9);
              ctx.font = '7px Segoe UI'; ctx.globalAlpha=0.7;
              ctx.fillText(fmt(fvg.top)+' – '+fmt(fvg.bottom), xF1+2, yFT+18);
              ctx.globalAlpha=1;
            }
          }
        }
      }

      // ── DISTRIBUTION (impulsive move) ──
      if(dS >= 0 && dS < ve && dE >= vs){
        const x1 = dToX(Math.max(dS, vs), L);
        const x2 = dToX(Math.min(dE, ve-1), L) + cw/2;
        const distSlice = d.slice(Math.max(dS,vs), Math.min(dE+1,ve));
        if(distSlice.length>0){
          const dHigh = Math.max(...distSlice.map(b=>b.h));
          const dLow  = Math.min(...distSlice.map(b=>b.l));
          const y1 = pY(dHigh + cyc.avgATR*0.05);
          const y2 = pY(dLow  - cyc.avgATR*0.05);
          ctx.fillStyle = cfg.distColor;
          ctx.fillRect(x1, y1, x2-x1, y2-y1);
          ctx.strokeStyle = cfg.distBorder;
          ctx.lineWidth = 1.5; ctx.setLineDash([]);
          ctx.strokeRect(x1, y1, x2-x1, y2-y1);
          // Direction arrow inside distribution zone
          const midX = (x1+x2)/2;
          ctx.strokeStyle = cfg.distBorder;
          ctx.lineWidth = 2;
          ctx.beginPath();
          if(bull){
            ctx.moveTo(midX, y2-4); ctx.lineTo(midX, y1+4);
            ctx.moveTo(midX-4, y1+10); ctx.lineTo(midX, y1+4); ctx.lineTo(midX+4, y1+10);
          } else {
            ctx.moveTo(midX, y1+4); ctx.lineTo(midX, y2-4);
            ctx.moveTo(midX-4, y2-10); ctx.lineTo(midX, y2-4); ctx.lineTo(midX+4, y2-10);
          }
          ctx.stroke();
          if(cfg.showLabels && x2-x1>16){
            ctx.fillStyle = cfg.distBorder;
            ctx.font = 'bold 8px Segoe UI'; ctx.textAlign = 'center';
            ctx.fillText('DIST', (x1+x2)/2, y1+10);
          }
        }
      }

      // ── Flow arrow connecting phases ──
      // Draw a subtle curved arrow: ACCUM → MANIP → FVG → DIST
      if(aE>=vs&&aE<ve && mI>=vs&&mI<ve){
        const xA = dToX(Math.min(aE,ve-1),L);
        const xM2 = dToX(Math.min(mI,ve-1),L);
        const yMid = pY((cyc.rangeH+cyc.rangeL)/2);
        ctx.strokeStyle='rgba(255,255,255,0.12)';
        ctx.lineWidth=1; ctx.setLineDash([2,4]);
        ctx.beginPath(); ctx.moveTo(xA,yMid); ctx.lineTo(xM2,yMid);
        ctx.stroke(); ctx.setLineDash([]);
      }
    });
  }

  // ─ Volume Profile ─
  if(IC.vp.vis){
    const vp=calcVP(d,+IC.vp.bins);
    const maxVol=Math.max(...vp.map(b=>b.vol));
    if(maxVol>0){
      const vpW=L.rPad-8,vpX=L.W-L.rPad+2;
      vp.forEach(b=>{
        const y1=pY(b.pH),y2=pY(b.pL);
        if(y2<L.tPad||y1>L.tPad+L.cH)return;
        const bH=Math.max(1,y2-y1);
        ctx.fillStyle=IC.vp.upColor;ctx.globalAlpha=.35;
        ctx.fillRect(vpX,y1,(b.upVol/maxVol)*vpW,bH);
        ctx.fillStyle=IC.vp.dnColor;
        ctx.fillRect(vpX+(b.upVol/maxVol)*vpW,y1,(b.dnVol/maxVol)*vpW,bH);
        ctx.globalAlpha=1;
      });
      const poc=vp.reduce((a,b)=>b.vol>a.vol?b:a);
      const pocY=(pY(poc.pH)+pY(poc.pL))/2;
      ctx.strokeStyle=IC.vp.pocColor;ctx.lineWidth=1;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(L.lPad,pocY);ctx.lineTo(L.W-L.rPad+vpW,pocY);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle=IC.vp.pocColor;ctx.font='bold 8px Segoe UI';ctx.textAlign='right';
      ctx.fillText('POC',vpX+vpW-1,pocY-2);
    }
  }

  // ─ Last price line ─
  const lastBar=d[d.length-1];
  if(lastBar&&pY(lastBar.c)>=L.tPad&&pY(lastBar.c)<=L.tPad+L.cH){
    const ly=pY(lastBar.c),isUp=lastBar.c>=(d.length>1?d[d.length-2].c:lastBar.o);
    const lc=isUp?IC.candle.upColor:IC.candle.dnColor;
    // Dashed line across chart
    ctx.strokeStyle=isUp?'rgba(38,166,154,0.45)':'rgba(239,83,80,0.45)';
    ctx.lineWidth=1;ctx.setLineDash([3,5]);
    ctx.beginPath();ctx.moveTo(L.lPad,ly);ctx.lineTo(L.W-L.rPad,ly);ctx.stroke();
    ctx.setLineDash([]);
    // Badge on price axis
    ctx.fillStyle=lc;
    roundRect(ctx,L.W-L.rPad+1,ly-8,L.rPad-3,16,3);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 10px Segoe UI';ctx.textAlign='left';
    ctx.fillText(fmt(lastBar.c),L.W-L.rPad+5,ly+3);
  }

  // ─ Selection handles ─
  if(S.selDraw!==null&&S.drawings[S.selDraw]){
    drawSelectionHandles(S.drawings[S.selDraw],minP,maxP,L);
  }

  // ─ Crosshair ─
  const{x:mx,y:my}=S.mouse;
  if(mx>L.lPad&&mx<L.W-L.rPad&&my>L.tPad&&my<L.tPad+L.cH){
    ctx.strokeStyle='rgba(255,255,255,0.13)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(mx,L.tPad);ctx.lineTo(mx,L.tPad+L.cH);ctx.stroke();
    ctx.beginPath();ctx.moveTo(L.lPad,my);ctx.lineTo(L.W-L.rPad,my);ctx.stroke();
    ctx.setLineDash([]);
    const crossP=yToP(my,minP,maxP,L);
    ctx.fillStyle='#1e3a5f';
    roundRect(ctx,L.W-L.rPad+1,my-8,L.rPad-3,16,3);ctx.fill();
    ctx.strokeStyle='#4f8ef7';ctx.lineWidth=1;
    roundRect(ctx,L.W-L.rPad+1,my-8,L.rPad-3,16,3);ctx.stroke();
    ctx.fillStyle='#8ab4f8';ctx.font='bold 10px Segoe UI';ctx.textAlign='left';
    ctx.fillText(fmt(crossP),L.W-L.rPad+5,my+3);
  }

  // ─ In-progress drawing preview ─
  if(S.curDraw)drawPreview(minP,maxP,L);
}

// ─ User drawings render ─
function drawUserShapes(view,vs,ve,minP,maxP,L){
  const pY=p=>pToY(p,minP,maxP,L);
  S.drawings.forEach(dr=>{
    ctx.save();ctx.setLineDash([]);
    if(dr.type==='hline'){
      const y=pY(dr.price);
      ctx.strokeStyle=dr.color||'rgba(255,255,255,0.6)';ctx.lineWidth=dr.width||1.5;
      ctx.beginPath();ctx.moveTo(L.lPad,y);ctx.lineTo(L.W-L.rPad,y);ctx.stroke();
      ctx.fillStyle=dr.color||'rgba(255,255,255,0.8)';
      ctx.font='10px Segoe UI';ctx.textAlign='left';
      ctx.fillText(fmt(dr.price),L.lPad+4,y-3);
    }
    else if(dr.type==='tline'){
      const x1=dToX(dr.i1,L),y1=pY(dr.p1),x2=dToX(dr.i2,L),y2=pY(dr.p2);
      ctx.strokeStyle=dr.color||'rgba(79,142,247,0.8)';ctx.lineWidth=dr.width||1.5;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      // extend
      const slope=(y2-y1)/(x2-x1||1);
      ctx.globalAlpha=.25;ctx.setLineDash([5,5]);
      ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(L.W-L.rPad,y2+slope*(L.W-L.rPad-x2));ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;
    }
    else if(dr.type==='rect'){
      const x1=dToX(dr.i1,L),y1=pY(dr.p1),x2=dToX(dr.i2,L),y2=pY(dr.p2);
      const rx=Math.min(x1,x2),ry=Math.min(y1,y2),rw=Math.abs(x2-x1),rh=Math.abs(y2-y1);
      ctx.fillStyle=dr.fillColor||'rgba(79,142,247,0.07)';ctx.fillRect(rx,ry,rw,rh);
      ctx.strokeStyle=dr.color||'rgba(79,142,247,0.5)';ctx.lineWidth=1;ctx.strokeRect(rx,ry,rw,rh);
    }
    else if(dr.type==='fib'){
      const x1=dToX(dr.i1,L),x2=dToX(dr.i2,L);
      const xL=Math.min(x1,x2),xR=Math.max(x1,x2);
      const pRange=dr.p1-dr.p2;
      [0,.236,.382,.5,.618,.786,1].forEach(lvl=>{
        const p=dr.p2+pRange*lvl,y=pY(p);
        const a=lvl===0||lvl===1?.7:.4;
        ctx.strokeStyle=`rgba(245,158,11,${a})`;ctx.lineWidth=1;
        ctx.setLineDash(lvl===0||lvl===1?[]:[4,3]);
        ctx.beginPath();ctx.moveTo(xL,y);ctx.lineTo(xR,y);ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle=`rgba(245,158,11,${a+.2})`;ctx.font='9px Segoe UI';ctx.textAlign='left';
        ctx.fillText(`${(lvl*100).toFixed(1)}%  ${fmt(p)}`,xL+2,y-2);
      });
    }
    else if(dr.type==='ray'){
      const x1=dToX(dr.i1,L),y1=pY(dr.p1),x2=dToX(dr.i2,L),y2=pY(dr.p2);
      const slope=(y2-y1)/(x2-x1||1);
      const xEnd=L.W-L.rPad;
      const yEnd=y1+slope*(xEnd-x1);
      ctx.strokeStyle=dr.color||'rgba(79,142,247,0.8)';ctx.lineWidth=dr.width||1.5;ctx.setLineDash([]);
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(xEnd,yEnd);ctx.stroke();
      // Origin dot
      ctx.fillStyle=dr.color||'rgba(79,142,247,0.8)';ctx.beginPath();ctx.arc(x1,y1,3,0,Math.PI*2);ctx.fill();
    }
    else if(dr.type==='gann'){
      // Gann Fan: 8 lines from origin at angles 1:1, 2:1, 1:2, 3:1, 1:3, 4:1, 1:4, 8:1
      const x0=dToX(dr.i1,L),y0=pY(dr.p1);
      const angles=[1/8,1/4,1/3,1/2,1,2,3,4,8];
      const labels=['8:1','4:1','3:1','2:1','1:1','1:2','1:3','1:4','1:8'];
      const unitX=cw*4; // 1 unit = 4 bars width
      const unitY=L.cH/20; // 1 unit price step
      angles.forEach((ratio,k)=>{
        const xEnd2=L.W-L.rPad,yEnd2=y0-(xEnd2-x0)*ratio*(unitY/unitX);
        if(yEnd2>L.tPad+L.cH||yEnd2<L.tPad)return;
        const alpha=ratio===1?0.8:0.35;
        ctx.strokeStyle=`rgba(167,139,250,${alpha})`;ctx.lineWidth=ratio===1?1.5:0.7;ctx.setLineDash([]);
        ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(xEnd2,yEnd2);ctx.stroke();
        ctx.fillStyle=`rgba(167,139,250,${alpha+0.1})`;ctx.font='7px Segoe UI';ctx.textAlign='left';
        ctx.fillText(labels[k],Math.min(x0+60,xEnd2-20),yEnd2-2);
      });
    }
    else if(dr.type==='cycle'){
      const x1=dToX(dr.i1,L),x2=dToX(dr.i2,L);
      const cycleW=Math.abs(x2-x1);
      if(cycleW<2)return;
      const xStart=Math.min(x1,x2);
      // Draw repeated cycles forward
      let cx=xStart;
      ctx.strokeStyle=dr.color||'rgba(167,139,250,0.5)';ctx.lineWidth=1;ctx.setLineDash([4,3]);
      for(let c=0;c<8;c++){
        if(cx>L.W-L.rPad)break;
        // Semicircle arc
        ctx.beginPath();
        ctx.arc(cx+cycleW/2,L.tPad+L.cH,cycleW/2,Math.PI,0);
        ctx.stroke();
        // Vertical tick
        ctx.setLineDash([]);ctx.strokeStyle='rgba(167,139,250,0.3)';ctx.lineWidth=0.7;
        ctx.beginPath();ctx.moveTo(cx,L.tPad);ctx.lineTo(cx,L.tPad+L.cH);ctx.stroke();
        ctx.setLineDash([4,3]);ctx.strokeStyle=dr.color||'rgba(167,139,250,0.5)';ctx.lineWidth=1;
        cx+=cycleW;
      }
      ctx.setLineDash([]);
    }
    else if(dr.type==='pitchfork'){
      if(!dr.pts||dr.pts.length<3)return;
      const [A,B,C]=dr.pts.map(p=>({x:dToX(p.i,L),y:pY(p.p)}));
      const midX=(B.x+C.x)/2,midY=(B.y+C.y)/2;
      // Median line A→mid(BC)
      const slope=(midY-A.y)/(midX-A.x||1);
      const xEnd=L.W-L.rPad;
      ctx.strokeStyle=dr.color||'rgba(167,139,250,0.7)';ctx.lineWidth=dr.width||1.2;ctx.setLineDash([]);
      ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(xEnd,A.y+slope*(xEnd-A.x));ctx.stroke();
      // Upper fork B→parallel
      const slopeF=(midY-A.y)/(midX-A.x||1);
      ctx.strokeStyle=dr.color||'rgba(167,139,250,0.5)';ctx.lineWidth=0.8;
      [B,C].forEach(pt=>{
        ctx.beginPath();ctx.moveTo(pt.x,pt.y);ctx.lineTo(xEnd,pt.y+slopeF*(xEnd-pt.x));ctx.stroke();
      });
      // Handle dots
      [A,B,C].forEach(pt=>{
        ctx.fillStyle=dr.color||'rgba(167,139,250,0.8)';ctx.beginPath();ctx.arc(pt.x,pt.y,3,0,Math.PI*2);ctx.fill();
      });
      // Label
      ctx.fillStyle=dr.color||'rgba(167,139,250,0.8)';ctx.font='8px Segoe UI';ctx.textAlign='left';
      ctx.fillText('Pitchfork',A.x+4,A.y-4);
    }
    else if(dr.type==='ellwave'){
      if(!dr.pts||dr.pts.length<2)return;
      const pts2=dr.pts.map((p,k)=>({x:dToX(p.i,L),y:pY(p.p),label:String(k+1)}));
      ctx.strokeStyle=dr.color||'#f59e0b';ctx.lineWidth=dr.width||1.5;ctx.setLineDash([]);
      ctx.beginPath();pts2.forEach((pt,k)=>k===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y));ctx.stroke();
      pts2.forEach(pt=>{
        ctx.fillStyle=dr.color||'#f59e0b';ctx.beginPath();ctx.arc(pt.x,pt.y,4,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';ctx.font='bold 8px Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(pt.label,pt.x,pt.y);ctx.textBaseline='alphabetic';
      });
      if(pts2.length===5){ctx.fillStyle='rgba(245,158,11,0.5)';ctx.font='7px Segoe UI';ctx.textAlign='left';ctx.fillText('EW Done',pts2[4].x+4,pts2[4].y);}
    }
    else if(dr.type==='annot'){
      const x=dToX(dr.i,L),y=pY(dr.price);
      // Pin line
      ctx.strokeStyle=dr.color||'#f59e0b';ctx.lineWidth=1;ctx.setLineDash([2,2]);
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-24);ctx.stroke();ctx.setLineDash([]);
      // Box
      ctx.font=`${dr.fontSize||11}px Segoe UI`;
      const tw=ctx.measureText(dr.text).width;
      const bx=clamp(x-tw/2-6,L.lPad,L.W-L.rPad-tw-16),by=y-44;
      ctx.fillStyle='#1a1a24';ctx.globalAlpha=0.92;
      roundRect(ctx,bx,by,tw+12,18,4);ctx.fill();ctx.globalAlpha=1;
      ctx.strokeStyle=dr.color||'#f59e0b';ctx.lineWidth=1;
      roundRect(ctx,bx,by,tw+12,18,4);ctx.stroke();
      ctx.fillStyle=dr.color||'#f59e0b';ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.fillText(dr.text,bx+6,by+9);ctx.textBaseline='alphabetic';
      // Dot
      ctx.fillStyle=dr.color||'#f59e0b';ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
    }
    else if(dr.type==='avwap'){
      const activeD=S.filteredData.length?S.filteredData:S.data;
      const vwap=calcAVWAP(activeD,dr.anchorIdx);
      ctx.strokeStyle=dr.color||'#f59e0b';ctx.lineWidth=dr.width||1.5;ctx.setLineDash([]);
      let started=false;
      activeD.forEach((_,i)=>{
        if(i<vs||i>=ve||vwap[i]==null)return;
        const x=dToX(i,L),y=pY(vwap[i]);
        if(!started){ctx.beginPath();ctx.moveTo(x,y);started=true}
        else ctx.lineTo(x,y);
      });
      if(started)ctx.stroke();
      if(dr.anchorIdx>=vs&&dr.anchorIdx<ve){
        const ax=dToX(dr.anchorIdx,L),ay=pY(activeD[dr.anchorIdx]?.c||0);
        ctx.fillStyle=dr.color||'#f59e0b';ctx.beginPath();ctx.arc(ax,ay,4,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=dr.color||'#f59e0b';ctx.font='bold 9px Segoe UI';ctx.textAlign='center';
        ctx.fillText('⚓VWAP',ax,ay-8);
      }
    }
    else if(dr.type==='frvp'){
      const i0=Math.min(dr.i0,dr.i1),i1=Math.max(dr.i0,dr.i1);
      const x0=dToX(i0,L),x1v=dToX(i1,L);
      // Range highlight
      ctx.fillStyle='rgba(255,255,255,0.03)';
      ctx.fillRect(x0,L.tPad,x1v-x0,L.cH);
      ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;ctx.setLineDash([4,3]);
      ctx.strokeRect(x0,L.tPad,x1v-x0,L.cH);ctx.setLineDash([]);
      // VP for range
      const activeDF=S.filteredData.length?S.filteredData:S.data;
      const vp=calcFRVP(activeDF,i0,i1,30);
      const maxVol=Math.max(...vp.map(b=>b.vol));
      if(maxVol>0){
        const vpW=Math.min(60,(x1v-x0)*.4);
        vp.forEach(b=>{
          const y1=pY(b.pH),y2=pY(b.pL);
          if(y2<L.tPad||y1>L.tPad+L.cH)return;
          const bH=Math.max(1,y2-y1);
          ctx.fillStyle='rgba(79,142,247,0.35)';ctx.globalAlpha=1;
          ctx.fillRect(x0,y1,(b.vol/maxVol)*vpW,bH);
        });
        const poc=vp.reduce((a,b)=>b.vol>a.vol?b:a);
        const pocY=(pY(poc.pH)+pY(poc.pL))/2;
        ctx.strokeStyle='rgba(79,142,247,0.9)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
        ctx.beginPath();ctx.moveTo(x0,pocY);ctx.lineTo(x1v,pocY);ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle='rgba(79,142,247,.9)';ctx.font='bold 8px Segoe UI';ctx.textAlign='left';
        ctx.fillText('POC',x0+2,pocY-2);
      }
    }
    ctx.restore();
  });
}

// ─ Drawing preview ─
function drawPreview(minP,maxP,L){
  if(!S.curDraw)return;
  const pY=p=>pToY(p,minP,maxP,L);
  const dr=S.curDraw;
  ctx.save();ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
  if(dr.type==='hline'){
    ctx.beginPath();ctx.moveTo(L.lPad,S.mouse.y);ctx.lineTo(L.W-L.rPad,S.mouse.y);ctx.stroke();
  } else if(['tline','fib'].includes(dr.type)){
    const x1=dToX(dr.i1,L),y1=pY(dr.p1);
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(S.mouse.x,S.mouse.y);ctx.stroke();
  } else if(dr.type==='rect'){
    const x1=dToX(dr.i1,L),y1=pY(dr.p1);
    const rw=S.mouse.x-x1,rh=S.mouse.y-y1;
    ctx.fillStyle='rgba(255,255,255,0.04)';ctx.fillRect(x1,y1,rw,rh);
    ctx.strokeRect(x1,y1,rw,rh);
  } else if(dr.type==='cycle'){
    if(dr.i1!=null){
      const x1=dToX(dr.i1,L);
      ctx.strokeStyle='rgba(167,139,250,0.4)';ctx.setLineDash([2,4]);
      ctx.beginPath();ctx.moveTo(x1,L.tPad);ctx.lineTo(x1,L.tPad+L.cH);ctx.stroke();
      ctx.setLineDash([]);
      // Preview cycle width from anchor to mouse
      const cw2=Math.abs(S.mouse.x-x1);
      if(cw2>4){
        ctx.beginPath();ctx.arc(x1+cw2/2,L.tPad+L.cH,cw2/2,Math.PI,0);ctx.stroke();
      }
    }
  } else if(dr.type==='pitchfork'){
    if(dr.pts&&dr.pts.length>=1){
      const pts=dr.pts.map(p=>({x:dToX(p.i,L),y:pY(p.p)}));
      ctx.strokeStyle='rgba(167,139,250,0.5)';ctx.setLineDash([]);
      ctx.beginPath();pts.forEach((pt,k)=>k===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y));
      ctx.lineTo(S.mouse.x,S.mouse.y);ctx.stroke();
      pts.forEach(pt=>{ctx.beginPath();ctx.arc(pt.x,pt.y,3,0,Math.PI*2);ctx.fill()});
    }
  } else if(dr.type==='ellwave'){
    if(dr.pts&&dr.pts.length>=1){
      const pts=dr.pts.map((p,k)=>({x:dToX(p.i,L),y:pY(p.p),n:k+1}));
      ctx.strokeStyle='rgba(245,158,11,0.5)';ctx.setLineDash([]);
      ctx.beginPath();pts.forEach((pt,k)=>k===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y));
      ctx.lineTo(S.mouse.x,S.mouse.y);ctx.stroke();
      pts.forEach(pt=>{
        ctx.fillStyle='rgba(245,158,11,0.7)';ctx.beginPath();ctx.arc(pt.x,pt.y,4,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';ctx.font='bold 8px Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(pt.n,pt.x,pt.y);ctx.textBaseline='alphabetic';
      });
      ctx.fillStyle='rgba(245,158,11,0.5)';ctx.font='7px Segoe UI';ctx.textAlign='center';
      ctx.fillText(`${pts.length}/5`,S.mouse.x,S.mouse.y-8);
    }
  } else if(dr.type==='avwap'){
    ctx.strokeStyle='rgba(245,158,11,0.5)';ctx.setLineDash([]);
    const _aD=S.filteredData.length?S.filteredData:S.data;
    const ax=dToX(dr.anchorIdx,L),ay=pY(_aD[dr.anchorIdx]?.c||0);
    ctx.beginPath();ctx.arc(ax,ay,5,0,Math.PI*2);ctx.stroke();
  } else if(dr.type==='frvp'){
    const x1=dToX(dr.i0,L),x2=S.mouse.x;
    ctx.fillStyle='rgba(255,255,255,0.03)';ctx.fillRect(Math.min(x1,x2),L.tPad,Math.abs(x2-x1),L.cH);
    ctx.strokeRect(Math.min(x1,x2),L.tPad,Math.abs(x2-x1),L.cH);
  }
  ctx.restore();
}

// ─ roundRect helper ─
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ─ Draw selection handles on selected drawing ─
function drawSelectionHandles(dr,minP,maxP,L){
  const pY=p=>pToY(p,minP,maxP,L);
  const pts=getDrawingHandlePoints(dr,L,pY);
  if(!pts)return;
  // Highlight selected
  ctx.save();
  ctx.strokeStyle='rgba(79,142,247,0.6)';ctx.lineWidth=2;ctx.setLineDash([4,3]);
  if(pts.outline){
    ctx.beginPath();
    pts.outline.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
    if(pts.close)ctx.closePath();
    ctx.stroke();
  }
  ctx.setLineDash([]);
  // Handle dots
  pts.handles.forEach(h=>{
    ctx.fillStyle='#fff';ctx.strokeStyle='#4f8ef7';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(h.x,h.y,5,0,Math.PI*2);ctx.fill();ctx.stroke();
  });
  ctx.restore();
}

// Returns handle points for hit-testing and rendering
function getDrawingHandlePoints(dr,L,pY){
  if(!dr)return null;
  if(dr.type==='hline'){
    const y=pY(dr.price);
    return{handles:[{x:L.lPad+L.cW*.25,y,id:'p1'},{x:L.lPad+L.cW*.75,y,id:'p1'}],
      outline:[{x:L.lPad,y},{x:L.W-L.rPad,y}],close:false};
  }
  if(dr.type==='tline'||dr.type==='fib'){
    const x1=dToX(dr.i1,L),y1=pY(dr.p1),x2=dToX(dr.i2,L),y2=pY(dr.p2);
    return{handles:[{x:x1,y:y1,id:'p1'},{x:x2,y:y2,id:'p2'},{x:(x1+x2)/2,y:(y1+y2)/2,id:'body'}],
      outline:[{x:x1,y:y1},{x:x2,y:y2}],close:false};
  }
  if(dr.type==='rect'){
    const x1=dToX(dr.i1,L),y1=pY(dr.p1),x2=dToX(dr.i2,L),y2=pY(dr.p2);
    return{handles:[{x:x1,y:y1,id:'p1'},{x:x2,y:y2,id:'p2'},
        {x:(x1+x2)/2,y:(y1+y2)/2,id:'body'}],
      outline:[{x:x1,y:y1},{x:x2,y:y1},{x:x2,y:y2},{x:x1,y:y2}],close:true};
  }
  if(dr.type==='avwap'){
    const _aD2=S.filteredData.length?S.filteredData:S.data;
    const ax=dToX(dr.anchorIdx,L),ay=pY(_aD2[dr.anchorIdx]?.c||0);
    return{handles:[{x:ax,y:ay,id:'anchor'}],outline:null,close:false};
  }
  if(dr.type==='frvp'){
    const x1=dToX(dr.i0,L),x2=dToX(dr.i1,L);
    return{handles:[{x:x1,y:L.tPad+L.cH/2,id:'i0'},{x:x2,y:L.tPad+L.cH/2,id:'i1'},
        {x:(x1+x2)/2,y:L.tPad+L.cH/2,id:'body'}],
      outline:[{x:x1,y:L.tPad},{x:x2,y:L.tPad},{x:x2,y:L.tPad+L.cH},{x:x1,y:L.tPad+L.cH}],close:true};
  }
  return null;
}

// Hit test: given mouse pos, find which drawing+handle is hit
function hitTestDrawings(mx,my,minP,maxP,L){
  const pY=p=>pToY(p,minP,maxP,L);
  if(!S.drawings.length)return null;
  for(let di=S.drawings.length-1;di>=0;di--){
    const dr=S.drawings[di];
    const pts=getDrawingHandlePoints(dr,L,pY);
    if(!pts)continue;
    // Check handles first
    for(const h of pts.handles){
      if(Math.hypot(mx-h.x,my-h.y)<8)return{drawIdx:di,handle:h.id};
    }
    // Check body/line proximity
    if(pts.outline){
      for(let k=0;k<pts.outline.length-1;k++){
        const a=pts.outline[k],b=pts.outline[k+1];
        if(distToSegment(mx,my,a.x,a.y,b.x,b.y)<7)return{drawIdx:di,handle:'body'};
      }
      if(pts.close&&pts.outline.length>2){
        const a=pts.outline[pts.outline.length-1],b=pts.outline[0];
        if(distToSegment(mx,my,a.x,a.y,b.x,b.y)<7)return{drawIdx:di,handle:'body'};
      }
    }
  }
  return null;
}

function distToSegment(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay;
  if(dx===0&&dy===0)return Math.hypot(px-ax,py-ay);
  const t=clamp(((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy),0,1);
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}

// Show edit popup for selected drawing
function showEditPopup(di,x,y){
  const dr=S.drawings[di];
  if(!dr)return;
  const popup=document.getElementById('draw-edit-popup');
  const colInp=document.getElementById('dep-color');
  const widInp=document.getElementById('dep-width');
  const prcInp=document.getElementById('dep-price');
  const prRow=document.getElementById('dep-price-row');

  colInp.value=dr.color||'#4f8ef7';
  widInp.value=dr.width||1.5;
  prRow.style.display=dr.type==='hline'?'flex':'none';
  if(dr.type==='hline')prcInp.value=Math.round(dr.price);

  // Position popup
  const outer=document.getElementById('canvas-outer');
  const ow=outer.clientWidth,oh=outer.clientHeight;
  popup.style.display='block';
  const pw=popup.offsetWidth||190,ph2=popup.offsetHeight||100;
  popup.style.left=clamp(x+10,4,ow-pw-4)+'px';
  popup.style.top=clamp(y-20,4,oh-ph2-4)+'px';

  // Wire inputs
  colInp.onchange=()=>{dr.color=colInp.value;draw()};
  widInp.onchange=()=>{dr.width=+widInp.value;draw()};
  prcInp.onchange=()=>{if(dr.type==='hline')dr.price=+prcInp.value;draw()};
  document.getElementById('dep-done').onclick=closeEditPopup;
  document.getElementById('dep-del').onclick=()=>{
    S.drawings.splice(di,1);S.selDraw=null;S.editHandle=null;
    closeEditPopup();draw();
  };
}

function closeEditPopup(){
  document.getElementById('draw-edit-popup').style.display='none';
  S.selDraw=null;S.editHandle=null;
  draw();
}

// ════════════════════════════════════════════════════════════
//  MOUSE / TOUCH EVENTS
// ════════════════════════════════════════════════════════════
function getPos(e){
  const rect=canvas.getBoundingClientRect();
  const src=e.touches?e.touches[0]:e;
  return{x:src.clientX-rect.left,y:src.clientY-rect.top};
}

// Helper: get min/max for current view
function viewMinMax(){
  const d=S.filteredData.length?S.filteredData:S.data;
  const vs=clamp(Math.floor(S.viewStart),0,Math.max(d.length-1,0));
  const ve=clamp(Math.ceil(S.viewEnd),1,d.length);
  const view=d.slice(vs,ve);
  if(!view.length)return{minP:0,maxP:1,vs,ve,d};
  const{minP,maxP}=getVisiblePriceRange(view);
  return{minP,maxP,vs,ve,d};
}

canvas.addEventListener('mousemove',e=>{
  const{x,y}=getPos(e);S.mouse.x=x;S.mouse.y=y;
  const L=getLayout();
  const{minP,maxP}=viewMinMax();

  // OHLCV tooltip
  const activeD=S.filteredData.length?S.filteredData:S.data;
  const idx=clamp(xToIdx(x,L),0,activeD.length-1);
  if(activeD[idx]){
    const b=activeD[idx];
    document.getElementById('ci-o').textContent=fmt(b.o);
    document.getElementById('ci-h').textContent=fmt(b.h);
    document.getElementById('ci-l').textContent=fmt(b.l);
    document.getElementById('ci-c').textContent=fmt(b.c);
    document.getElementById('ci-v').textContent=fmtV(b.v);
  }

  // Drag handle (move/scale drawing)
  if(S.editHandle&&S.editHandle.dragging){
    const eh=S.editHandle;
    const dr=S.drawings[eh.drawIdx];
    const price=yToP(y,minP,maxP,L);
    const didx=clamp(xToIdx(x,L),0,S.data.length-1);
    if(dr){
      if(eh.handle==='body'){
        // Move entire drawing
        const dp=price-eh.startPrice;
        const di2=didx-eh.startIdx;
        if(dr.type==='hline'){dr.price=eh.origPrice+dp}
        else if(dr.type==='tline'||dr.type==='fib'||dr.type==='rect'){
          dr.p1=eh.origP1+dp;dr.p2=eh.origP2+dp;
          dr.i1=clamp(eh.origI1+di2,0,S.data.length-1);
          dr.i2=clamp(eh.origI2+di2,0,S.data.length-1);
        }
        else if(dr.type==='avwap')dr.anchorIdx=clamp(eh.origAnchor+di2,0,(S.filteredData.length||S.data.length)-1);
        else if(dr.type==='frvp'){dr.i0=clamp(eh.origI0+di2,0,(S.filteredData.length||S.data.length)-1);dr.i1=clamp(eh.origI1+di2,0,(S.filteredData.length||S.data.length)-1)}
      } else if(eh.handle==='p1'||eh.handle==='anchor'){
        if(dr.type==='hline')dr.price=price;
        else if(dr.type==='tline'||dr.type==='fib'||dr.type==='rect'){dr.p1=price;dr.i1=didx}
        else if(dr.type==='avwap')dr.anchorIdx=didx;
      } else if(eh.handle==='p2'){
        if(dr.type==='tline'||dr.type==='fib'||dr.type==='rect'){dr.p2=price;dr.i2=didx}
      } else if(eh.handle==='i0'){dr.i0=didx}
        else if(eh.handle==='i1'){dr.i1=didx}
    }
    draw();return;
  }

  // Panel border drag (resize bottom panels)
  if(S.panelDrag.active){
    const dy=y-S.panelDrag.sy;
    const newH=clamp(S.panelDrag.startH+dy,24,200);
    S.panelHeights[S.panelDrag.panel]=newH;
    draw();return;
  }

  // Y-axis drag (price zoom)
  if(S.yDrag.active){
    const dy=y-S.yDrag.sy;
    const range=S.yDrag.startMax-S.yDrag.startMin;
    const factor=dy/L.cH;
    const midP=(S.yDrag.startMax+S.yDrag.startMin)/2;
    const newRange=clamp(range*(1+factor*2),range*.1,range*5);
    S.priceMin=midP-newRange/2;S.priceMax=midP+newRange/2;
    draw();return;
  }

  // Panel border hover detection (within 6px of border)
  S._hoverPanel=null;
  const PYhov=panelY(L);
  const panelBorders=[
    {key:'vol',y:PYhov.vol,     vis:IC.vol.vis},
    {key:'vdelta',y:PYhov.vdelta,vis:IC.volDelta?.vis},
    {key:'macd',y:PYhov.macd,   vis:IC.macdPanel?.vis},
    {key:'stoch',y:PYhov.stoch, vis:IC.stochPanel?.vis},
  ];
  let onBorder=false;
  panelBorders.forEach(pb=>{
    if(!pb.vis||pb.y<=L.tPad+L.cH)return;
    if(Math.abs(y-pb.y)<7){S._hoverPanel=pb.key;onBorder=true;}
  });

  // Pan chart (X)
  if(S.drag.active&&!S.drawTool&&!S.editHandle){
    const bW=L.cW/Math.max(S.viewEnd-S.viewStart,1);
    const db=(S.drag.sx-x)/bW;
    const n=S.drag.sve-S.drag.svs;
    let ns=S.drag.svs+db,ne=S.drag.sve+db;
    if(ns<0){ns=0;ne=n}
    if(ne>activeD.length){ne=activeD.length;ns=ne-n}
    S.viewStart=ns;S.viewEnd=ne;
  }

  // Cursor hint: show grab cursor when hovering a drawing (no tool active)
  if(!S.drawTool){
    const hit=hitTestDrawings(x,y,minP,maxP,L);
    if(x>L.W-L.rPad||onBorder){
      canvas.classList.add('cur-ns');canvas.classList.remove('cur-grab');
    } else {
      canvas.classList.remove('cur-ns');
      canvas.classList.toggle('cur-grab',!!hit&&!S.drag.active);
    }
  }

  draw();
});

canvas.addEventListener('mousedown',e=>{
  e.preventDefault();
  const{x,y}=getPos(e);
  const L=getLayout();
  const{minP,maxP}=viewMinMax();
  const price=yToP(y,minP,maxP,L);
  const activeD2=S.filteredData.length?S.filteredData:S.data;
  const idx=clamp(xToIdx(x,L),0,activeD2.length-1);

  // Close edit popup on canvas click outside popup
  const popup=document.getElementById('draw-edit-popup');
  if(popup.style.display==='block'){
    const pr=popup.getBoundingClientRect();
    const cr=canvas.getBoundingClientRect();
    const px2=e.clientX-cr.left,py2=e.clientY-cr.top;
    const rx=pr.left-cr.left,ry=pr.top-cr.top;
    if(px2<rx||px2>rx+pr.width||py2<ry||py2>ry+pr.height){closeEditPopup();return}
  }

  if(S.drawTool){
    // ─ Drawing mode ─
    if(S.drawTool==='hline'){
      S.drawings.push({type:'hline',price,color:'rgba(255,255,255,0.65)',width:1.5});
      exitDrawMode();
    } else if(S.drawTool==='avwap'){
      S.drawings.push({type:'avwap',anchorIdx:idx,color:'#f59e0b',width:1.5});
      exitDrawMode();
    } else if(S.drawTool==='annot'){
      const note=prompt('Catatan:','');
      if(note){S.drawings.push({type:'annot',i:idx,price,text:note,color:'#f59e0b',fontSize:11})}
      exitDrawMode();
    } else if(S.drawTool==='ray'){
      if(!S.curDraw)S.curDraw={type:'ray',i1:idx,p1:price};
      else{S.drawings.push({...S.curDraw,i2:idx,p2:price});S.curDraw=null;exitDrawMode()}
    } else if(S.drawTool==='gann'){
      S.drawings.push({type:'gann',i1:idx,p1:price,color:'rgba(167,139,250,0.6)',width:1});
      exitDrawMode();
    } else if(S.drawTool==='cycle'){
      if(!S.curDraw)S.curDraw={type:'cycle',i1:idx,p1:price};
      else{S.drawings.push({...S.curDraw,i2:idx,p2:price});S.curDraw=null;exitDrawMode()}
    } else if(S.drawTool==='pitchfork'){
      if(!S.curDraw){S.curDraw={type:'pitchfork',pts:[{i:idx,p:price}]}}
      else{
        S.curDraw.pts.push({i:idx,p:price});
        if(S.curDraw.pts.length===3){
          S.drawings.push({...S.curDraw,color:'rgba(167,139,250,0.7)',width:1.2});
          S.curDraw=null;exitDrawMode();
        }
      }
    } else if(S.drawTool==='ellwave'){
      if(!S.curDraw){S.curDraw={type:'ellwave',pts:[{i:idx,p:price}]}}
      else{
        S.curDraw.pts.push({i:idx,p:price});
        if(S.curDraw.pts.length===5){
          S.drawings.push({...S.curDraw,color:'#f59e0b',width:1.5});
          S.curDraw=null;exitDrawMode();
        }
      }
    } else if(!S.curDraw){
      S.curDraw=S.drawTool==='frvp'?{type:'frvp',i0:idx}:{type:S.drawTool,i1:idx,p1:price};
    } else {
      if(S.drawTool==='frvp') S.drawings.push({type:'frvp',i0:S.curDraw.i0,i1:idx});
      else if(S.drawTool==='fib') S.drawings.push({type:'fib',i1:S.curDraw.i1,p1:S.curDraw.p1,i2:idx,p2:price});
      else S.drawings.push({...S.curDraw,i2:idx,p2:price});
      S.curDraw=null;exitDrawMode();
    }
    draw();

  } else {
    // ─ Panel border drag (resize bottom panels) ─
    const PYmd=panelY(L);
    const panelBordersD=[
      {key:'vol',   y:PYmd.vol,    vis:IC.vol.vis},
      {key:'vdelta',y:PYmd.vdelta, vis:IC.volDelta?.vis},
      {key:'macd',  y:PYmd.macd,   vis:IC.macdPanel?.vis},
      {key:'stoch', y:PYmd.stoch,  vis:IC.stochPanel?.vis},
    ];
    let hitPanel=null;
    panelBordersD.forEach(pb=>{
      if(!pb.vis||pb.y<=L.tPad+L.cH)return;
      if(Math.abs(y-pb.y)<8) hitPanel=pb;
    });
    if(hitPanel){
      S.panelDrag={active:true,sy:y,panel:hitPanel.key,startH:S.panelHeights[hitPanel.key]};
      canvas.classList.add('cur-ns');
      return;
    }
    // ─ Y-axis drag (right side) ─
    if(x>L.W-L.rPad){
      S.yDrag={active:true,sy:y,startMin:minP,startMax:maxP};
      canvas.classList.add('cur-ns');
      return;
    }
    // ─ Selection mode ─
    const hit=hitTestDrawings(x,y,minP,maxP,L);
    if(hit){
      S.selDraw=hit.drawIdx;
      const dr=S.drawings[hit.drawIdx];
      // Start handle drag
      S.editHandle={
        drawIdx:hit.drawIdx,handle:hit.handle,dragging:true,
        startPrice:price,startIdx:idx,
        origPrice:dr.price,
        origP1:dr.p1,origP2:dr.p2,
        origI1:dr.i1,origI2:dr.i2,
        origAnchor:dr.anchorIdx,
        origI0:dr.i0,origI1b:dr.i1,
      };
      canvas.classList.add('cur-grabbing');
    } else {
      // Deselect
      S.selDraw=null;S.editHandle=null;closeEditPopup();
      S.drag={active:true,sx:x,svs:S.viewStart,sve:S.viewEnd};
      canvas.classList.add('cur-grabbing');
    }
    draw();
  }
});

canvas.addEventListener('mouseup',e=>{
  if(S.editHandle?.dragging){
    const{x,y}=getPos(e);
    S.editHandle.dragging=false;
    showEditPopup(S.editHandle.drawIdx,x,y);
  }
  S.drag.active=false;
  S.yDrag.active=false;
  S.panelDrag.active=false;
  canvas.classList.remove('cur-grabbing','cur-grab','cur-ns');
});

canvas.addEventListener('mouseleave',()=>{
  S.drag.active=false;
  S.yDrag.active=false;
  S.panelDrag.active=false;
  S._hoverPanel=null;
  canvas.classList.remove('cur-grabbing','cur-grab','cur-ns');
  draw();
});



canvas.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(S.curDraw){S.curDraw=null;draw();return}
  // Right-click on drawing = delete it
  const{x,y}=getPos(e);
  const L=getLayout();
  const{minP,maxP}=viewMinMax();
  const hit=hitTestDrawings(x,y,minP,maxP,L);
  if(hit){
    S.drawings.splice(hit.drawIdx,1);
    if(S.selDraw===hit.drawIdx)S.selDraw=null;
    closeEditPopup();draw();
  } else {
    // fallback: remove last
    if(S.drawings.length){S.drawings.pop();draw()}
  }
});

// Delete key removes selected drawing
document.addEventListener('keydown',e=>{
  // Delete selected drawing
  if((e.key==='Delete'||e.key==='Backspace')&&S.selDraw!==null&&
      document.activeElement===document.body){
    S.drawings.splice(S.selDraw,1);S.selDraw=null;S.editHandle=null;
    closeEditPopup();draw();return;
  }
  if(e.key==='Escape'){S.curDraw=null;exitDrawMode();draw();return;}

  // Arrow keys — only when no input is focused
  if(document.activeElement!==document.body)return;

  const d=S.filteredData.length?S.filteredData:S.data;
  const L=getLayout();
  const vs=clamp(Math.floor(S.viewStart),0,d.length-1);
  const ve=clamp(Math.ceil(S.viewEnd),1,d.length);
  const view=d.slice(vs,ve);
  if(!view.length)return;
  const{minP,maxP}=getVisiblePriceRange(view);

  if(e.key==='ArrowUp'||e.key==='ArrowDown'){
    e.preventDefault();
    // Move price axis up or down (pan Y)
    const range=maxP-minP;
    const step=range*0.04*(e.shiftKey?5:1); // Shift = 5× faster
    if(S.priceMin===null){S.priceMin=minP;S.priceMax=maxP;}
    if(e.key==='ArrowUp')  {S.priceMin+=step;S.priceMax+=step;}
    if(e.key==='ArrowDown'){S.priceMin-=step;S.priceMax-=step;}
    draw();return;
  }
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    e.preventDefault();
    // Pan X axis
    const step=e.shiftKey?10:3;
    const n=S.viewEnd-S.viewStart;
    let ns=S.viewStart+(e.key==='ArrowRight'?step:-step);
    let ne=S.viewEnd+(e.key==='ArrowRight'?step:-step);
    if(ns<0){ns=0;ne=n;}
    if(ne>d.length){ne=d.length;ns=ne-n;}
    S.viewStart=ns;S.viewEnd=ne;
    draw();return;
  }
  // + / - keys for zoom
  if(e.key==='+'||e.key==='='||e.key==='-'){
    e.preventDefault();
    const n=S.viewEnd-S.viewStart;
    const factor=(e.key==='-')?1.12:0.89;
    const newN=clamp(n*factor,6,d.length);
    const mid=S.viewStart+n/2;
    S.viewStart=Math.max(0,mid-newN/2);
    S.viewEnd=Math.min(d.length,S.viewStart+newN);
    draw();return;
  }
  // R key = reset all zoom/pan
  if(e.key==='r'||e.key==='R'){
    S.priceMin=null;S.priceMax=null;
    S.viewStart=0;S.viewEnd=d.length;
    draw();
  }
});

function exitDrawMode(){
  S.drawTool=null;canvas.className='cur-cross';
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('on'));
  setHint(false);
}

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const L=getLayout();
  const{x,y}=getPos(e);
  const activeD=S.filteredData.length?S.filteredData:S.data;

  // Ctrl/Meta = Y-axis zoom (price range)
  if(e.ctrlKey||e.metaKey){
    const{minP,maxP}=viewMinMax();
    const midP=yToP(y,minP,maxP,L);
    const factor=e.deltaY>0?1.08:.93;
    const range=(maxP-minP)/2*factor;
    S.priceMin=midP-range;S.priceMax=midP+range;
    draw();return;
  }

  // Shift = horizontal scroll (pan)
  if(e.shiftKey){
    const bW=L.cW/Math.max(S.viewEnd-S.viewStart,1);
    const dBars=e.deltaY>0?3:-3;
    const n=S.viewEnd-S.viewStart;
    let ns=S.viewStart+dBars,ne=S.viewEnd+dBars;
    if(ns<0){ns=0;ne=n}
    if(ne>activeD.length){ne=activeD.length;ns=ne-n}
    S.viewStart=ns;S.viewEnd=ne;
    draw();return;
  }

  // Normal = X zoom (smooth)
  const frac=Math.max(0,Math.min(1,(x-L.lPad)/L.cW));
  const n=S.viewEnd-S.viewStart;
  // Smooth factor based on delta magnitude
  const rawDelta=Math.abs(e.deltaY);
  const factor=e.deltaY>0?Math.min(1+rawDelta*.002,1.12):Math.max(1-rawDelta*.002,.89);
  const newN=clamp(n*factor,6,activeD.length);
  const pivot=S.viewStart+frac*n;
  S.viewStart=Math.max(0,pivot-frac*newN);
  S.viewEnd=Math.min(activeD.length,S.viewStart+newN);
  draw();
},{passive:false});

// Double-click Y axis = reset Y zoom
canvas.addEventListener('dblclick',e=>{
  const{x,y}=getPos(e);
  const L=getLayout();
  // Check if on price axis area
  if(x>L.W-L.rPad&&x<L.W){
    S.priceMin=null;S.priceMax=null;draw();return;
  }
  // Select drawing
  const{minP,maxP}=viewMinMax();

// ════════════════════════════════════════════════════════════
//  TOUCH EVENTS — pan & pinch-to-zoom for mobile
// ════════════════════════════════════════════════════════════
(()=>{
  let _t1=null,_t2=null,_lastX=0,_lastDist=0;

  function _dist(a,b){ return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); }

  canvas.addEventListener('touchstart',e=>{
    const touches=Array.from(e.touches);
    if(touches.length===1){
      _t1=touches[0];_t2=null;
      _lastX=touches[0].clientX;
      e.preventDefault();
    } else if(touches.length===2){
      _t1=touches[0];_t2=touches[1];
      _lastDist=_dist(_t1,_t2);
      e.preventDefault();
    }
  },{passive:false});

  canvas.addEventListener('touchmove',e=>{
    const touches=Array.from(e.touches);
    const L=getLayout();
    const activeD=S.filteredData.length?S.filteredData:S.data;
    if(!activeD.length) return;
    const bW=L.cW/Math.max(S.viewEnd-S.viewStart,1);

    if(touches.length===1&&_t1&&!_t2){
      const dx=touches[0].clientX-_lastX;
      _lastX=touches[0].clientX;
      const dBars=Math.round(-dx/Math.max(bW,1));
      if(dBars!==0){
        const n=S.viewEnd-S.viewStart;
        let ns=S.viewStart+dBars,ne=S.viewEnd+dBars;
        if(ns<0){ns=0;ne=n}
        if(ne>activeD.length){ne=activeD.length;ns=ne-n}
        S.viewStart=Math.max(0,ns);S.viewEnd=Math.min(activeD.length,ne);
        draw();
      }
      e.preventDefault();
    } else if(touches.length===2&&_t1&&_t2){
      const newDist=_dist(touches[0],touches[1]);
      const scale=_lastDist/newDist;
      _lastDist=newDist;
      const n=S.viewEnd-S.viewStart;
      const newN=clamp(n*scale,6,activeD.length);
      const mid=(S.viewStart+S.viewEnd)/2;
      S.viewStart=Math.max(0,Math.round(mid-newN/2));
      S.viewEnd=Math.min(activeD.length,Math.round(mid+newN/2));
      draw();
      e.preventDefault();
    }
  },{passive:false});

  canvas.addEventListener('touchend',e=>{
    if(e.touches.length===0){_t1=null;_t2=null;}
    else if(e.touches.length===1){_t2=null;_t1=e.touches[0];_lastX=_t1.clientX;}
  },{passive:false});
})();

// ════════════════════════════════════════════════════════════
//  LOAD DATA
// ════════════════════════════════════════════════════════════
async function loadData(silent=false){
  const lo=document.getElementById('loading');
  const err=document.getElementById('err-msg');
  const lmsg=document.getElementById('load-msg');
  const retry=document.getElementById('retry-btn');
  if(!silent){lo.style.display='flex';S.priceMin=null;S.priceMax=null;}
  err.textContent='';retry.style.display='none';

  // Try interval, with fallback to coarser intervals if Yahoo rejects
  const intervalFallbacks={
    '1m':['1m','2m','5m'],'2m':['2m','5m'],'5m':['5m','15m'],
    '15m':['15m','30m','60m'],'30m':['30m','60m'],'45m':['60m','90m'],
    '60m':['60m','90m','1d'],'90m':['90m','60m','1d'],
    '2h_agg':['2h_agg','60m','1d'],'4h_agg':['4h_agg','60m','1d'],
    '1d':['1d','1wk'],'1wk':['1wk'],'1mo':['1mo'],
  };

  let data=null;
  const toTry=intervalFallbacks[S.intervalKey]||[S.intervalKey];
  for(const intv of toTry){
    try{
      lmsg.textContent=`Memuat ${S.sym} (${intv}, ${S.rangeDays}d)...`;
      let d;
      if(S.customFrom&&S.customTo){
        d=await fetchYahoo(S.sym,intv,Math.ceil((S.customTo-S.customFrom)/864e5)+1,S.customFrom,S.customTo);
      } else {
        d=await fetchYahoo(S.sym,intv,S.rangeDays,null,null);
      }
      if(d?.length>=1){data=d;break}
    }catch(e){err.textContent=e.message}
  }

  if(!data||!data.length){
    err.textContent=`Gagal memuat ${S.sym}`;retry.style.display='inline-block';
    return;
  }

  if(!silent){
    S.viewStart=0;S.viewEnd=data.length;
  } else {
    // Silent refresh: preserve zoom/pan, extend view end if new bars arrived
    const oldLen=S.data.length;
    const newBars=data.length-oldLen;
    if(newBars>0){
      S.viewEnd=Math.min(data.length,S.viewEnd+newBars);
    }
  }
  S.data=data;
  S.filteredData=data;
  lo.style.display='none';

  const last=data[data.length-1],first=data[0];
  const chg=last.c-first.c,pct=chg/first.c*100;
  const cls=chg>0?'up':chg<0?'dn':'flat',sg=chg>0?'+':'';
  document.getElementById('price-display').textContent=fmt(last.c);
  document.getElementById('price-display').className=cls;
  document.getElementById('chg-display').textContent=`${sg}${fmt(chg)} (${sg}${pct.toFixed(2)}%)`;
  document.getElementById('chg-display').className=cls;
  document.getElementById('update-lbl').textContent=new Date().toLocaleTimeString('id-ID');
  document.getElementById('ci-o').textContent=fmt(last.o);
  document.getElementById('ci-h').textContent=fmt(last.h);
  document.getElementById('ci-l').textContent=fmt(last.l);
  document.getElementById('ci-c').textContent=fmt(last.c);
  document.getElementById('ci-v').textContent=fmtV(last.v);
  S.priceCache[S.sym]={price:last.c,chg,pct,date:last.t};
  renderList(document.getElementById('search-inp').value,S.activeSector);
  renderWatchlist();
  buildIndOverlay();
  buildLegend();draw();
  scheduleRefresh();
}

function scheduleRefresh(){
  clearTimeout(S.refreshTimer);
  const intraIntervals=['1m','2m','5m','15m','30m','45m','60m','90m','2h_agg','4h_agg'];
  const isIntra=intraIntervals.includes(S.intervalKey);
  // 1m/2m: 10s, 5m-30m: 20s, 1h+intra: 30s, daily+: 60s
  let delay=60000;
  if(isIntra){
    if(['1m','2m'].includes(S.intervalKey))delay=10000;
    else if(['5m','15m','30m'].includes(S.intervalKey))delay=20000;
    else delay=30000;
  }
  S.refreshTimer=setTimeout(()=>{
    loadData(true); // silent=true means no loading overlay
  },delay);
}

function buildLegend(){
  const items=[];
  if(IC.candle.vis)items.push({c:IC.candle.upColor,l:'Bull'},{c:IC.candle.dnColor,l:'Bear'});
  if(IC.ma.vis)items.push({c:IC.ma.c1,l:`MA${IC.ma.p1}`},{c:IC.ma.c2,l:`MA${IC.ma.p2}`});
  if(IC.ema.vis)items.push({c:IC.ema.c1,l:`EMA${IC.ema.p1}`},{c:IC.ema.c2,l:`EMA${IC.ema.p2}`});
  if(IC.bb.vis)items.push({c:IC.bb.color,l:`BB(${IC.bb.period},${IC.bb.mult})`});
  if(IC.sr.vis)items.push({c:IC.sr.supColor,l:'Sup'},{c:IC.sr.resColor,l:'Res'});
  if(IC.vp.vis)items.push({c:IC.vp.pocColor,l:'POC'});
  if(IC.fvg.vis)items.push({c:'rgba(38,166,154,.6)',l:'FVG Bull'},{c:'rgba(239,83,80,.6)',l:'FVG Bear'});
  if(IC.ob.vis)items.push({c:'rgba(38,166,154,.6)',l:'OB Bull'},{c:'rgba(239,83,80,.6)',l:'OB Bear'});
  if(IC.sig.vis) items.push({c:IC.sig.buyColor,l:'BUY Signal'},{c:IC.sig.sellColor,l:'SELL Signal'});
  if(IC.amfd?.vis) items.push(
    {c:IC.amfd.accumBorder, l:'Accumulation'},
    {c:IC.amfd.manipBorder, l:'Manipulation'},
    {c:IC.amfd.fvgBorder,   l:'FVG'},
    {c:IC.amfd.distBorder,  l:'Distribution'},
  );
  const legEl=document.getElementById('legend');
  legEl.innerHTML=items.map(it=>`<div class="leg"><div class="leg-line" style="background:${it.c}"></div>${it.l}</div>`).join('');
  updateIndOverlay();
}

let watchlist = [];

function renderList(filter='',sector='all'){
  const q=filter.toUpperCase();
  let pool;
  if(sector&&sector!=='all'){
    const sec=SECTORS.find(s=>s.id===sector);
    pool=sec?sec.stocks:STOCKS;
  } else {
    pool=STOCKS; // already deduped
  }
  const items=pool.filter(s=>!q||s.t.includes(q)||s.n.toLowerCase().includes(filter.toLowerCase()));

  // Group by sector if showing all
  let html='';
  if((!filter||filter.length<1)&&sector==='all'){
    SECTORS.forEach(sec=>{
      const secItems=sec.stocks.filter(s=>items.includes(s));
      if(!secItems.length)return;
      html+=`<div class="sec-hdr" data-sec="${sec.id}">${sec.label}</div>`;
      html+=secItems.map(s=>stockItem(s)).join('');
    });
  } else {
    html=items.map(s=>stockItem(s)).join('');
  }

  document.getElementById('stock-list').innerHTML=html;
  document.querySelectorAll('.si').forEach(el=>el.addEventListener('click',()=>{
    S.sym=el.dataset.t;
    const info=STOCKS.find(s=>s.t===S.sym);
    document.getElementById('sym-display').textContent=S.sym+(info?' · '+info.n:'');
    renderList(document.getElementById('search-inp').value,S.activeSector);
    loadData();
  }));
  // Sector header toggle
  document.querySelectorAll('.sec-hdr').forEach(hdr=>{
    hdr.addEventListener('click',()=>{
      const sec=hdr.dataset.sec;
      let el=hdr.nextElementSibling;
      let visible=null;
      while(el&&el.classList.contains('si')){
        if(visible===null)visible=el.style.display!=='none';
        el.style.display=visible?'none':'';
        el=el.nextElementSibling;
      }
      hdr.classList.toggle('collapsed',visible);
    });
  });
}

      if(btn) btn.classList.toggle('on',IC[key].vis);
      buildLegend();
      // Clear cache if indicator inputs changed (not just visibility/color)
      if(['period','mult','p1','p2','bins','window','maxLevels','tol','lookback','minMove'].includes(prop))
        Object.keys(CACHE).forEach(k=>delete CACHE[k]);
      draw();
    });
  });
}

function buildIndPanel(){
  const grid=document.getElementById('ind-grid');
  if(!grid)return;
  // Group indicators
  const groups={};
  IND_DEFS.forEach(def=>{
    if(!groups[def.group])groups[def.group]=[];
    groups[def.group].push(def);
  });
  grid.innerHTML='';
  Object.entries(groups).forEach(([grp,defs])=>{
    const gh=document.createElement('div');
    gh.style.cssText='grid-column:1/-1;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-top:4px;padding-bottom:2px;border-bottom:1px solid var(--border)';
    gh.textContent=grp; grid.appendChild(gh);
    defs.forEach(def=>{
      const vis=IC[def.key]?.vis;
      const card=document.createElement('div');
      card.style.cssText=`background:var(--bg2);border:1px solid ${vis?'var(--blue)':'var(--border)'};border-radius:6px;padding:7px 9px;cursor:pointer;transition:border-color .15s;position:relative`;
      card.innerHTML=`
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:11px;font-weight:600;color:${vis?'var(--text)':'var(--text2)'}">${def.label}</span>
          <span style="margin-left:auto;font-size:10px;color:${vis?'var(--blue)':'var(--text3)'}">${vis?'ON':'OFF'}</span>
        </div>`;
      card.addEventListener('click',e=>{
        if(e.target.closest('.ind-fields-wrap'))return;
        IC[def.key].vis=!IC[def.key].vis;
        buildIndPanel();buildIndOverlay();buildLegend();draw();
      });
      // Expand fields on right-click or settings icon
      if(def.fields.length){
        const gear=document.createElement('div');
        gear.style.cssText='position:absolute;top:5px;right:6px;font-size:10px;color:var(--text3);cursor:pointer;padding:0 2px';
        gear.textContent='⚙';
        gear.addEventListener('click',e=>{
          e.stopPropagation();
          let wrap=card.querySelector('.ind-fields-wrap');
          if(wrap){wrap.remove();return}
          wrap=document.createElement('div');
          wrap.className='ind-fields-wrap';
          wrap.style.cssText='margin-top:7px;border-top:1px solid var(--border);padding-top:6px;display:flex;flex-direction:column;gap:4px';
          def.fields.forEach(f=>{
            const row=document.createElement('div');
            row.style.cssText='display:flex;align-items:center;gap:6px';
            const lbl=document.createElement('label');
            lbl.style.cssText='font-size:10px;color:var(--text2);min-width:70px';
            lbl.textContent=f.l;
            let inp;
            if(f.t==='color'){
              inp=document.createElement('input');inp.type='color';
              inp.style.cssText='width:28px;height:20px;padding:1px;border:1px solid var(--border2);border-radius:3px;background:var(--bg3);cursor:pointer';
              inp.value=IC[def.key][f.p]||'#ffffff';
            } else if(f.t==='colorA'){
              inp=document.createElement('input');inp.type='text';
              inp.style.cssText='background:var(--bg3);border:1px solid var(--border2);border-radius:3px;color:var(--text);font-size:10px;padding:2px 5px;width:120px;outline:none';
              inp.value=IC[def.key][f.p]||'';
            } else if(f.t==='bool'){
              inp=document.createElement('input');inp.type='checkbox';
              inp.checked=IC[def.key][f.p];
            } else {
              inp=document.createElement('input');inp.type='number';
              inp.style.cssText='background:var(--bg3);border:1px solid var(--border2);border-radius:3px;color:var(--text);font-size:10px;padding:2px 5px;width:65px;outline:none';
              inp.value=IC[def.key][f.p];
              if(f.min!=null)inp.min=f.min;if(f.max!=null)inp.max=f.max;if(f.step)inp.step=f.step;
            }
            inp.addEventListener('change',()=>{
              if(f.t==='bool')IC[def.key][f.p]=inp.checked;
              else if(f.t==='num')IC[def.key][f.p]=parseFloat(inp.value)||0;
              else IC[def.key][f.p]=inp.value;
              Object.keys(CACHE).forEach(k=>delete CACHE[k]);
              buildIndOverlay();buildLegend();draw();
            });
            row.appendChild(lbl);row.appendChild(inp);
            wrap.appendChild(row);
          });
          card.appendChild(wrap);
        });
        card.appendChild(gear);
      }
      grid.appendChild(card);
    });
  });
}

function buildIndOverlay(){
  const el=document.getElementById('ind-overlay');
  if(!el)return;
  el.innerHTML='';
  IND_DEFS.filter(d=>IC[d.key]?.vis).forEach(def=>{
    const chip=document.createElement('div');
    chip.style.cssText='display:flex;align-items:center;gap:4px;background:rgba(13,13,15,0.82);border:1px solid var(--border2);border-radius:5px;padding:2px 7px;pointer-events:all;cursor:pointer;font-size:10px;color:var(--text2)';
    chip.innerHTML=`<span>${def.label}</span>`;
    // Eye (hide)
    const eye=document.createElement('span');
    eye.textContent='👁';eye.style.cssText='cursor:pointer;font-size:9px;opacity:.6';
    eye.title='Hide';
    eye.addEventListener('click',e=>{e.stopPropagation();IC[def.key].vis=false;buildIndOverlay();buildIndPanel();buildLegend();draw()});
    // Settings gear
    const g2=document.createElement('span');
    g2.textContent='⚙';g2.style.cssText='cursor:pointer;font-size:9px;opacity:.6';
    g2.title='Settings';
    g2.addEventListener('click',e=>{
      e.stopPropagation();
      document.getElementById('ind-panel').style.display='block';
      buildIndPanel();
      // Scroll to the relevant card
      setTimeout(()=>{
        const cards=[...document.querySelectorAll('#ind-grid div')];
        const match=cards.find(c=>c.textContent.includes(def.label));
        if(match)match.scrollIntoView({block:'center',behavior:'smooth'});
      },50);
    });
    chip.appendChild(eye);chip.appendChild(g2);
    el.appendChild(chip);
  });
}

let WATCHLIST = JSON.parse(localStorage.getItem('idx_watchlist')||'[]');

function saveWatchlist(){
  try{localStorage.setItem('idx_watchlist',JSON.stringify(WATCHLIST))}catch(_){}
}

function renderWatchlist(){
  const el=document.getElementById('watchlist-list');
  if(!el)return;
  if(!WATCHLIST.length){
    el.innerHTML='<div style="padding:10px 12px;font-size:11px;color:var(--text3)">Belum ada saham. Ketik kode di atas.</div>';
    return;
  }
  el.innerHTML=WATCHLIST.map(t=>{
    const p=S.priceCache[t];
    const info=STOCKS.find(s=>s.t===t);
    const prHtml=p
      ?`<span style="font-size:11px;font-weight:600;color:var(--text)">${fmt(p.price)}</span>
         <span style="font-size:10px;font-weight:600;color:${p.pct>0?'var(--up)':p.pct<0?'var(--dn)':'var(--text2)'}">${p.pct>0?'+':''}${p.pct.toFixed(2)}%</span>`
      :'<span style="font-size:10px;color:var(--text3)">—</span>';
    return `<div class="wl-item" data-t="${t}" style="display:flex;align-items:center;padding:7px 12px;border-bottom:1px solid var(--border);cursor:pointer;gap:8px;transition:background .1s"
      onmouseenter="this.style.background='var(--bg2)'" onmouseleave="this.style.background=''"
      >
      <div style="flex:1">
        <div style="font-size:12px;font-weight:700;color:var(--text)">${t}</div>
        <div style="font-size:10px;color:var(--text2);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${info?.n||''}</div>
      </div>
      <div style="text-align:right;display:flex;flex-direction:column;gap:2px">${prHtml}</div>
      <span data-rm="${t}" style="color:var(--text3);cursor:pointer;font-size:13px;padding:0 2px" title="Remove">×</span>
    </div>`;
  }).join('');

  el.querySelectorAll('.wl-item').forEach(item=>{
    item.addEventListener('click',e=>{
      if(e.target.dataset.rm)return;
      const t=item.dataset.t;
      S.sym=t;
      const info=STOCKS.find(s=>s.t===t);
      document.getElementById('sym-display').textContent=t+(info?' · '+info.n:'');
      renderList(document.getElementById('search-inp').value,S.activeSector);
      document.getElementById('watchlist-panel').style.display='none';
      loadData();
    });
    const rm=item.querySelector('[data-rm]');
    if(rm)rm.addEventListener('click',e=>{
      e.stopPropagation();
      WATCHLIST=WATCHLIST.filter(x=>x!==rm.dataset.rm);
      saveWatchlist();renderWatchlist();
    });
  });
}
